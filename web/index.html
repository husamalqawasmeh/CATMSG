<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐱 CatMsg (PurrCord) — Cat-Themed Discord Messaging</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#14121D" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>" />
  <meta property="og:image" content="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>" />
  <style>
    :root {
      --rail-bg: #14121D;
      --sidebar-bg: #1D1A2B;
      --pod-bg: #171422;
      --feed-bg: #252136;
      --input-bg: #322C47;
      --card-bg: #2D2841;
      --card-hover: #393252;
      --paw-pink: #FF7EB6;
      --purrple: #9D7BFF;
      --gold: #FFD166;
      --mint: #43D9AD;
      --coral: #FF6B6B;
      --yarn-blue: #5CE1E6;
      --text-primary: #F4F1FA;
      --text-secondary: #B5AFC7;
      --text-muted: #7C7594;
      --border: rgba(255, 255, 255, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--feed-bg);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .app-shell {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* 1. SERVER RAIL */
    .server-rail {
      width: 74px;
      background: var(--rail-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 10px;
      flex-shrink: 0;
      z-index: 30;
    }

    .rail-divider {
      width: 34px;
      height: 2px;
      background: var(--border);
      margin: 2px 0;
    }

    .rail-btn-wrap {
      position: relative;
      width: 74px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .rail-pill {
      position: absolute;
      inset-inline-start: 0;
      width: 4px;
      height: 0;
      background: var(--paw-pink);
      border-radius: 4px;
      transition: all 0.18s ease;
    }

    .rail-btn-wrap:hover .rail-pill {
      height: 20px;
    }

    .rail-btn-wrap.active .rail-pill {
      height: 38px;
    }

    .rail-btn {
      width: 48px;
      height: 48px;
      border-radius: 24px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      cursor: pointer;
      transition: all 0.18s ease;
      position: relative;
    }

    .rail-btn:hover,
    .rail-btn-wrap.active .rail-btn {
      border-radius: 16px;
      background: rgba(255, 126, 182, 0.22);
      border-color: var(--paw-pink);
    }

    .rail-badge {
      position: absolute;
      top: -4px;
      inset-inline-end: -4px;
      background: var(--coral);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 10px;
      border: 2px solid var(--rail-bg);
    }

    /* 2. CHANNEL / DM SIDEBAR */
    .channel-sidebar {
      width: 254px;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      border-inline-end: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-header {
      height: 54px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      font-weight: 800;
      font-size: 15px;
      background: linear-gradient(135deg, rgba(255, 126, 182, 0.16), transparent);
    }

    .quest-mini-banner {
      margin: 10px 10px 4px;
      padding: 10px 12px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(255, 209, 102, 0.18), rgba(157, 123, 255, 0.18));
      border: 1px solid rgba(255, 209, 102, 0.45);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .quest-mini-banner:hover {
      transform: translateY(-1px);
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .cat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 6px 4px;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .chan-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 2px;
      transition: background 0.15s;
    }

    .chan-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
    }

    .chan-item.active {
      background: rgba(255, 126, 182, 0.18);
      color: var(--text-primary);
      font-weight: 700;
    }

    .user-pod {
      padding: 10px;
      background: var(--pod-bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-wrap {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 126, 182, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .status-dot {
      position: absolute;
      inset-inline-end: -1px;
      bottom: -1px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--pod-bg);
    }

    /* OWNER TAG */
    .owner-tag {
      background: linear-gradient(135deg, #FFD166, #FF9F1C);
      color: #14121D;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      box-shadow: 0 0 10px rgba(255, 209, 102, 0.45);
      display: inline-flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    /* 3. CENTER MAIN VIEW */
    .main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--feed-bg);
      min-width: 0;
    }

    .top-bar {
      height: 54px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .topic-text {
      color: var(--text-muted);
      font-size: 12.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      border-inline-start: 1px solid var(--border);
      padding-inline-start: 12px;
      margin-inline-start: 4px;
    }

    .coin-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 209, 102, 0.16);
      border: 1px solid rgba(255, 209, 102, 0.45);
      color: var(--gold);
      padding: 5px 11px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 12.5px;
      cursor: pointer;
    }

    .save-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(67, 217, 173, 0.15);
      border: 1px solid rgba(67, 217, 173, 0.45);
      color: var(--mint);
      padding: 5px 10px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }

    .save-pill:hover {
      background: rgba(67, 217, 173, 0.26);
    }

    .lang-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(157, 123, 255, 0.16);
      border: 1px solid rgba(157, 123, 255, 0.45);
      color: var(--text-primary);
      padding: 5px 10px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .lang-pill:hover {
      background: rgba(157, 123, 255, 0.28);
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 17px;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
    }

    .messages-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      user-select: text;
    }

    .welcome-card {
      padding: 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255, 126, 182, 0.12), rgba(157, 123, 255, 0.08));
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .msg-item {
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
      transition: background 0.12s;
    }

    .msg-item:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .msg-item.pinned {
      border: 1px solid rgba(255, 209, 102, 0.35);
    }

    .msg-item.business-announcement {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.14), rgba(255, 209, 102, 0.12));
      border: 1.5px solid rgba(16, 185, 129, 0.55);
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.12);
    }

    .puzzle-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: min(330px, 100%);
      margin: 0 auto;
      background: var(--rail-bg);
      padding: 8px;
      border-radius: 16px;
      border: 2px solid rgba(255, 126, 182, 0.45);
    }

    .puzzle-tile {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.12s, border-color 0.12s;
      aspect-ratio: 1 / 1;
      background: var(--card-bg);
    }

    .puzzle-tile:hover {
      transform: scale(1.03);
      border-color: rgba(255, 209, 102, 0.75);
    }

    .puzzle-tile.selected {
      border-color: #10B981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.4);
      transform: scale(0.96);
    }

    .puzzle-tile canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .reply-line {
      font-size: 12px;
      color: var(--text-muted);
      margin-inline-start: 16px;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .msg-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .badge-tag {
      background: rgba(157, 123, 255, 0.2);
      border: 1px solid rgba(157, 123, 255, 0.45);
      color: var(--text-primary);
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 8px;
    }

    .sticker-card {
      margin-top: 8px;
      width: 210px;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--card-bg);
      border: 1.5px solid var(--paw-pink);
      text-align: center;
    }

    .reactions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      align-items: center;
    }

    .react-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      font-size: 12px;
      cursor: pointer;
      color: var(--text-secondary);
      font-weight: 700;
    }

    .react-pill.active {
      background: rgba(255, 126, 182, 0.22);
      border-color: var(--paw-pink);
      color: var(--paw-pink);
    }

    .msg-action-link {
      font-size: 11.5px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .msg-action-link:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.06);
    }

    /* COMPOSER & STICKER DRAWER */
    .sticker-drawer {
      background: var(--sidebar-bg);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
    }

    .sticker-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-top: 8px;
    }

    .sticker-option {
      min-width: 170px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      text-align: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .sticker-option:hover {
      border-color: var(--paw-pink);
    }

    .pack-emojis-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
    }

    .single-emoji-slot {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--sidebar-bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .single-emoji-slot:hover {
      transform: translateY(-2px) scale(1.06);
      border-color: var(--paw-pink);
      background: rgba(255, 126, 182, 0.16);
    }

    .reply-banner {
      background: var(--card-bg);
      border-top: 1px solid rgba(255, 126, 182, 0.4);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
    }

    .composer-bar {
      padding: 10px 14px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .composer-input {
      flex: 1;
      background: var(--input-bg);
      border: 1.5px solid transparent;
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
    }

    .composer-input:focus {
      border-color: var(--paw-pink);
    }

    .btn-primary {
      background: var(--paw-pink);
      color: #14121D;
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-gold {
      background: var(--gold);
      color: #14121D;
      border: none;
      border-radius: 12px;
      padding: 10px 15px;
      font-weight: 800;
      font-size: 12.5px;
      cursor: pointer;
    }

    .btn-outline {
      background: var(--card-bg);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-outline:hover {
      border-color: var(--paw-pink);
      background: var(--card-hover);
    }

    .btn-square {
      background: var(--input-bg);
      border: none;
      border-radius: 12px;
      width: 42px;
      height: 42px;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-primary);
    }

    /* 4. MEMBER SIDEBAR */
    .member-sidebar {
      width: 262px;
      background: var(--sidebar-bg);
      border-inline-start: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .member-tile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 3px;
    }

    .member-tile:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    /* QUESTS & SHOP GRID */
    .quest-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .quest-card.claimable {
      border-color: var(--gold);
      box-shadow: 0 0 16px rgba(255, 209, 102, 0.14);
    }

    .progress-track {
      height: 8px;
      background: var(--rail-bg);
      border-radius: 6px;
      overflow: hidden;
      flex: 1;
    }

    .progress-fill {
      height: 100%;
      background: var(--paw-pink);
      transition: width 0.25s ease;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .shop-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* TOAST & MODAL */
    .toast-box {
      position: fixed;
      top: 66px;
      inset-inline-end: 24px;
      background: var(--card-bg);
      border: 1.5px solid var(--gold);
      padding: 12px 18px;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      z-index: 100;
      font-weight: 700;
      font-size: 13px;
      max-width: 400px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-card {
      background: var(--sidebar-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 94%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 22px;
    }

    .lang-selector-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .lang-option-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      color: var(--text-secondary);
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
      text-align: center;
    }

    .lang-option-btn.selected {
      border-color: var(--paw-pink);
      background: rgba(255, 126, 182, 0.2);
      color: var(--text-primary);
    }

    .data-save-panel {
      background: rgba(67, 217, 173, 0.08);
      border: 1px solid rgba(67, 217, 173, 0.35);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .data-btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    @media (max-width: 940px) {
      .member-sidebar {
        display: none;
      }
      .channel-sidebar {
        width: 215px;
      }
    }

    @media (max-width: 680px) {
      .channel-sidebar {
        display: none;
      }
      .channel-sidebar.mobile-open {
        display: flex;
        position: fixed;
        inset-inline-start: 74px;
        top: 0;
        bottom: 0;
        z-index: 90;
      }
    }

    /* SIGN-IN PORTAL & ADVANCED SETTINGS & WHITEBOARD */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, #27223A 0%, #14121D 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 18px;
    }

    .auth-card {
      background: var(--sidebar-bg);
      border: 1.5px solid var(--border);
      border-radius: 22px;
      width: 100%;
      max-width: 460px;
      padding: 26px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      background: var(--rail-bg);
      padding: 5px;
      border-radius: 14px;
      margin: 16px 0;
    }

    .auth-tab {
      flex: 1;
      padding: 9px 12px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }

    .auth-tab.active {
      background: var(--paw-pink);
      color: #14121D;
    }

    .adv-preview-card {
      background: var(--rail-bg);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .phone-reward-box {
      background: rgba(255, 209, 102, 0.09);
      border: 1.5px solid rgba(255, 209, 102, 0.4);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .whiteboard-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      overflow: hidden;
    }

    .whiteboard-toolbar {
      background: var(--sidebar-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .marker-btn {
      display: inline-flex;
      align-items: center;

      };
    }

    function chooseBestSnapshot(snapA, snapB) {
      if (!snapA && !snapB) return null;
      if (!snapA) return snapB;
      if (!snapB) return snapA;
      const timeA = snapA.savedAt ? Date.parse(snapA.savedAt) || 0 : 0;
      const timeB = snapB.savedAt ? Date.parse(snapB.savedAt) || 0 : 0;
      const winner = timeB >= timeA ? snapB : snapA;
      const bucksA = (snapA.currentUser && typeof snapA.currentUser.meowBucks === 'number') ? snapA.currentUser.meowBucks : 0;
      const bucksB = (snapB.currentUser && typeof snapB.currentUser.meowBucks === 'number') ? snapB.currentUser.meowBucks : 0;
      const bucksTimeA = (snapA.currentUser && snapA.currentUser.meowBucksUpdatedAt) ? (Date.parse(snapA.currentUser.meowBucksUpdatedAt) || 0) : 0;
      const bucksTimeB = (snapB.currentUser && snapB.currentUser.meowBucksUpdatedAt) ? (Date.parse(snapB.currentUser.meowBucksUpdatedAt) || 0) : 0;
      if (winner.currentUser) {
        if (bucksTimeA === 0 && bucksTimeB === 0) {
          winner.currentUser.meowBucks = Math.max(bucksA, bucksB);
        } else if (bucksTimeB > bucksTimeA) {
          winner.currentUser.meowBucks = bucksB;
          winner.currentUser.meowBucksUpdatedAt = snapB.currentUser.meowBucksUpdatedAt;
        } else if (bucksTimeA > bucksTimeB) {
          winner.currentUser.meowBucks = bucksA;
          winner.currentUser.meowBucksUpdatedAt = snapA.currentUser.meowBucksUpdatedAt;
        } else {
          winner.currentUser.meowBucks = winner === snapB ? bucksB : bucksA;
        }
        const avatarTimeA = (snapA.currentUser && snapA.currentUser.avatarUpdatedAt) ? (Date.parse(snapA.currentUser.avatarUpdatedAt) || 0) : 0;
        const avatarTimeB = (snapB.currentUser && snapB.currentUser.avatarUpdatedAt) ? (Date.parse(snapB.currentUser.avatarUpdatedAt) || 0) : 0;
        if (avatarTimeB > avatarTimeA && snapB.currentUser) {
          winner.currentUser.avatarEmoji = snapB.currentUser.avatarEmoji;

        if (premTimeB > premTimeA && snapB.currentUser) {
          winner.currentUser.isPremium = !!snapB.currentUser.isPremium;

        if (bwB > bwA && snapB.currentUser) {

        const puzA = (snapA.currentUser && snapA.currentUser.lastDailyPuzzleRewardDate) || '';

    async function syncPromoCodesFromCloud() {
      try {
        const rawLocal = localStorage.getItem(PROMO_CODES_STORAGE_KEY);
        if (rawLocal) {
          state.promoCodes = { ...state.promoCodes, ...JSON.parse(rawLocal) };
        }
      } catch (e) {}
      try {
        const res = await fetch('/api/userdata?key=__promo_codes_registry__', { cache: 'no-store' });
        const data = await res.json();
        if (data && data.found && data.snapshot && typeof data.snapshot === 'object') {
          const cleaned = {};
          for (const [cKey, cVal] of Object.entries(data.snapshot)) {
            if (cKey !== 'savedAtServer' && cVal && typeof cVal === 'object' && cVal.code) {
              cleaned[cKey.toUpperCase()] = cVal;
            }
          }
          state.promoCodes = { ...state.promoCodes, ...cleaned };
          localStorage.setItem(PROMO_CODES_STORAGE_KEY, JSON.stringify(state.promoCodes));
        }
      } catch (e) {}
      return state.promoCodes;
    }

    async function savePromoCodesToCloud(codesObj) {
      state.promoCodes = codesObj || {};
      try {
        localStorage.setItem(PROMO_CODES_STORAGE_KEY, JSON.stringify(state.promoCodes));
        await fetch('/api/userdata?key=__promo_codes_registry__', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state.promoCodes)
        });
      } catch (e) {}
    }

    async function syncAccountsFromCloud() {
      try {
        const res = await fetch('/api/userdata?key=__accounts_registry__', { cache: 'no-store' });
        const data = await res.json();
        if (data && data.found && data.snapshot && typeof data.snapshot === 'object') {
          const localAccounts = getStoredAccounts();
          const merged = { ...localAccounts };
          for (const [k, cloudAcc] of Object.entries(data.snapshot)) {
            if (k === 'savedAtServer' || !cloudAcc || typeof cloudAcc !== 'object') continue;
            const cleanKey = k.toLowerCase().trim();
            const localAcc = merged[cleanKey] || {};
            const bestSnap = chooseBestSnapshot(localAcc.snapshot, cloudAcc.snapshot);
            merged[cleanKey] = {
              ...localAcc,
              ...cloudAcc,
              username: cleanKey,
              password: cloudAcc.password || localAcc.password || (bestSnap && bestSnap.accountPassword) || '',
              snapshot: bestSnap
            };
          }
          localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(merged));
          return merged;
        }
      } catch (e) {}
      return getStoredAccounts();
    }

    async function fetchCloudUserSnapshot(username) {
      const clean = (username || 'abood').toLowerCase().trim();
      try {
        const res = await fetch(`/api/userdata?key=${encodeURIComponent(clean)}`, { cache: 'no-store' });
        const data = await res.json();
        if (data && data.found && data.snapshot && typeof data.snapshot === 'object') {
          return data.snapshot;
        }
      } catch (e) {}
      return null;
    }

          premiumExpiresAt: null,
          lastBiweeklyCoinsClaimAt: null,
          lastDailyPuzzleRewardDate: null,
          removedFriendIds: [],
          unlockedMarkers: ['marker_white'],
          ...state.currentUser,
          ...snap.currentUser,
          avatarEmoji: resolvedAvatarEmoji,
          avatarManuallyCustomized: ownerAvatarCustomized,
          meowBucks: typeof snap.currentUser.meowBucks === 'number' ? snap.currentUser.meowBucks : (state.currentUser.meowBucks || 0),
          accountPassword: snap.accountPassword || snap.currentUser.accountPassword || state.currentUser.accountPassword || '',
          username: migratedUsername,
          displayName: migratedDisplayName,
          isOwner: isOwnerUser,
          removedFriendIds: snapRemovedIds,
          friendIds: resolvedFriendIds,
          ...(isOwnerUser ? {
            isPremium: true,
            premiumLifetime: true,
            premiumPlan: snap.currentUser.premiumPlan || 'Lifetime',
            premiumTier: snap.currentUser.premiumTier || 'standard'
          } : {})
        };
        if (!isOwnerUser && !state.currentUser.premiumLifetime && state.currentUser.premiumExpiresAt && Date.parse(state.currentUser.premiumExpiresAt) <= Date.now()) {

    async function loadSavedUserData(targetUsername = null) {
      let activeUser = (targetUsername || localStorage.getItem(ACTIVE_USER_KEY) || 'abood').toLowerCase();
      if (activeUser === 'captain_purr') {
        activeUser = 'abood';
        localStorage.setItem(ACTIVE_USER_KEY, 'abood');
      }
      const storageKey = getUserStorageKey(activeUser);
      let localSnap = null;
      let localNeedsPersist = false;
      try {
        const raw = localStorage.getItem(storageKey);
        if (raw) {
          localSnap = JSON.parse(raw);
        } else {
          const accounts = getStoredAccounts();
          const accEntry = accounts[activeUser] || (activeUser === 'abood' ? accounts['captain_purr'] : null);
          if (accEntry && accEntry.snapshot) {
            localSnap = accEntry.snapshot;
          }
        }
        if (localSnap) {
          applySnapshot(localSnap);
          if (state.currentUser.isOwner && !state.currentUser.avatarManuallyCustomized && localSnap.currentUser && localSnap.currentUser.avatarEmoji !== '🐱') {
            localNeedsPersist = true;
          }
        }
      } catch (e) {
        console.warn('Could not load local saved user data:', e);
      }

      // Always check cloud snapshot so account progress syncs across all browsers when logged into the same account
      const cloudSnap = await fetchCloudUserSnapshot(activeUser);
      if (cloudSnap) {
        const bestSnap = chooseBestSnapshot(localSnap, cloudSnap);
        if (bestSnap) {
          applySnapshot(bestSnap);
          const ownerAvatarMigrated = state.currentUser.isOwner && !state.currentUser.avatarManuallyCustomized && bestSnap.currentUser && bestSnap.currentUser.avatarEmoji !== '🐱';
          if (ownerAvatarMigrated) {
            autoPersistIfEnabled();
          } else {
            localStorage.setItem(storageKey, JSON.stringify(bestSnap));
          }
          render();
        }
      } else if (localNeedsPersist) {
        autoPersistIfEnabled();
        render();
      }
    }

    function autoPersistIfEnabled() {
      try {
        const snap = buildSerializableSnapshot();
        const key = (state.currentUser.username || 'abood').toLowerCase();
        const storageKey = getUserStorageKey(key);
        localStorage.setItem(storageKey, JSON.stringify(snap));
        localStorage.setItem(ACTIVE_USER_KEY, key);
        localStorage.setItem('catmsg_lang', state.lang);

        // Also update the global accounts registry so usernames, passwords, and progress are remembered across browsers
        const accounts = getStoredAccounts();
        if (key === 'abood' && accounts['captain_purr']) {
          delete accounts['captain_purr'];
        }
        const existingAcc = accounts[key] || {};
        const resolvedPassword = state.currentUser.accountPassword || existingAcc.password || snap.accountPassword || '';
        accounts[key] = {
          ...existingAcc,
          username: key,
          displayName: state.currentUser.displayName,
          avatarEmoji: state.currentUser.avatarEmoji,
          isOwner: !!state.currentUser.isOwner,
          password: resolvedPassword,
          googleEmail: state.currentUser.googleEmail || existingAcc.googleEmail || '',
          lastSavedAt: snap.savedAt,
          snapshot: snap
        };
        saveStoredAccounts(accounts);

        fetch(`/api/userdata?key=${encodeURIComponent(key)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(snap)
        }).catch(() => {});
      } catch (e) {
        console.warn('Auto-save failed:', e);
      }
    }

    window.addEventListener('beforeunload', () => {
      autoPersistIfEnabled();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        autoPersistIfEnabled();
      }
    });

    // Global Sign-Out Enforcement & Cross-Browser Cloud Account Sync
    (function enforceGlobalSignOutOnce() {
      syncPromoCodesFromCloud();
      syncAccountsFromCloud().then(() => {
        if (!state.isSignedIn) render();
      });
      try {
        if (localStorage.getItem(GLOBAL_SIGNOUT_EPOCH_KEY) !== 'v5') {
          localStorage.setItem(GLOBAL_SIGNOUT_EPOCH_KEY, 'v5');
          localStorage.removeItem(ACTIVE_USER_KEY);
          state.isSignedIn = false;
        } else {
          const active = localStorage.getItem(ACTIVE_USER_KEY);
          if (active) {
            state.isSignedIn = true;
            loadSavedUserData(active);
          } else {
            state.isSignedIn = false;
          }
        }
      } catch (e) {
        state.isSignedIn = false;
      }
    })();

    async function handleGoogleSignInSubmit() {
      const emailEl = document.getElementById('google-auth-email');
      const nameEl = document.getElementById('google-auth-name');
      const passEl = document.getElementById('google-auth-password');
      const rawEmail = (emailEl ? emailEl.value : '').trim().toLowerCase();
      const rawName = (nameEl ? nameEl.value : '').trim();
      const password = (passEl ? passEl.value : '').trim();

      if (!rawEmail || !rawEmail.includes('@')) {
        showToast(
          state.lang === 'ar'
            ? '😾 يرجى إدخال بريد Google إلكتروني صحيح (مثال: name@gmail.com)!'
            : '😾 Please enter a valid Google email address (e.g. name@gmail.com)!'
        );
        return;
      }

      if (!password) {
        showToast(
          state.lang === 'ar'
            ? '😾 يجب إنشاء أو إدخال كلمة مرور لحماية حساب Google الخاص بك!'
            : '😾 A password is required! Please create or enter your account password to sign in with Google.'
        );
        return;
      }

      const accounts = await syncAccountsFromCloud();

      if (rawEmail === OWNER_EMAIL.toLowerCase() || rawEmail === 'abood@gmail.com') {
        const cloudOwnerSnap = await fetchCloudUserSnapshot('abood');
        const ownerAcc = accounts['abood'] || accounts['captain_purr'] || null;
        const bestOwner = chooseBestSnapshot(ownerAcc && ownerAcc.snapshot, cloudOwnerSnap);
        const storedOwnerPwd = (ownerAcc && ownerAcc.password) || (bestOwner && bestOwner.accountPassword) || (bestOwner && bestOwner.currentUser && bestOwner.currentUser.accountPassword) || '';
        if (storedOwnerPwd && storedOwnerPwd !== password) {
          showToast(
            state.lang === 'ar'
              ? '😾 كلمة المرور غير صحيحة لحساب المالك @abood!'
              : '😾 Incorrect password for Owner account @abood!'

        a && typeof a === 'object' && (

      );
      const username = (emailMatchedAcc && emailMatchedAcc.username) ? emailMatchedAcc.username : localPart;

      const cloudSnap = await fetchCloudUserSnapshot(username);

      const storedPassword = (acc && acc.password) || (bestSnap && bestSnap.accountPassword) || (bestSnap && bestSnap.currentUser && bestSnap.currentUser.accountPassword) || '';

      if ((acc || bestSnap) && storedPassword && storedPassword !== password) {

      const bestSnap = chooseBestSnapshot(chooseBestSnapshot(localRawSnap, acc && acc.snapshot), cloudSnap);

            : `😾 Incorrect password for @${username}!`

        state.currentUser.accountPassword = password;

      autoPersistIfEnabled();
      showToast(

    function incrementQuest(actionType, delta = 1) {
      let newlyDone = null;
      for (const q of state.quests) {
        // Quests are strictly Once Per Account
        if (!q.isClaimed && q.actionType === actionType && q.currentProgress < q.targetCount) {
          q.currentProgress = Math.min(q.targetCount, q.currentProgress + delta);
          if (q.currentProgress >= q.targetCount) {
            newlyDone = state.lang === 'ar' ? q.titleAr : q.title;
          }
        }
      }
      autoPersistIfEnabled();
      if (newlyDone) {
        const allDone = state.quests.every(q => q.currentProgress >= q.targetCount);
        if (allDone && !state.currentUser.allQuestsBonusClaimed) {
          showToast(
            state.lang === 'ar'
              ? `🏆 اكتملت جميع المهام! افتح 🪙 المهام لاستلام مكافأة المهمة + مكافأة +150 🪙 الإضافية!`
              : `🏆 All Quests Complete! Open 🪙 Quests to claim your quest reward + the +150 🪙 All-Quests Bonus!`
          );
        } else {
          showToast(
            state.lang === 'ar'
              ? `🎉 اكتملت المهمة: "${newlyDone}"! افتح 🪙 المهام لاستلام عملات مياو!`
              : `🎉 Quest Complete: "${newlyDone}"! Click 🪙 Quests to claim your MeowCoins!`
          );
        }
      }
    }

      if (!allCompleted || state.currentUser.allQuestsBonusClaimed) return;

        showToast(state.lang === 'ar' ? '😾 يرجى إدخال الكود أولاً!' : '😾 Please enter a code first!');
        return;
      }
      if (!Array.isArray(state.currentUser.redeemedCodes)) {
        state.currentUser.redeemedCodes = [];

      if (state.currentUser.redeemedCodes.includes(raw)) {
        showToast(state.lang === 'ar' ? '😾 تم استخدام هذا الكود مسبقاً في حسابك!' : '😾 You already redeemed this code on your account!');
        return;
      }
      await syncPromoCodesFromCloud();
      const promoEntry = state.promoCodes[raw];
      const rewardCoins = (promoEntry && typeof promoEntry.meowCoins === 'number' && promoEntry.meowCoins > 0) ? promoEntry.meowCoins : 0;
      const rewardBucks = (promoEntry && typeof promoEntry.meowBucks === 'number' && promoEntry.meowBucks > 0) ? promoEntry.meowBucks : 0;

      if (promoEntry && (rewardCoins > 0 || rewardBucks > 0)) {
        state.currentUser.redeemedCodes.push(raw);
        if (rewardCoins > 0) {
          state.currentUser.meowCoins = (state.currentUser.meowCoins || 0) + rewardCoins;
        }
        if (rewardBucks > 0) {
          state.currentUser.meowBucks = (state.currentUser.meowBucks || 0) + rewardBucks;
          state.currentUser.meowBucksUpdatedAt = new Date().toISOString();
        }
        if (el) el.value = '';
        autoPersistIfEnabled();
        const partsEn = [];
        const partsAr = [];
        if (rewardCoins > 0) {
          partsEn.push(`+${rewardCoins} 🪙 MeowCoins`);
          partsAr.push(`+${rewardCoins} 🪙 عملة مياو`);
        }
        if (rewardBucks > 0) {
          partsEn.push(`+${rewardBucks} 💵 Meow Bucks`);
          partsAr.push(`+${rewardBucks} 💵 Meow Bucks`);
        }
        showToast(
          state.lang === 'ar'
            ? `🎟️ مبروك! تم تفعيل الكود "${raw}" وحصلت على ${partsAr.join(' و ')}!`
            : `🎟️ Code "${raw}" redeemed! You received ${partsEn.join(' & ')}!`

        state.lang === 'ar'
          ? `🎟️ الكود "${raw}" غير نشط حالياً — ترقبوا طرح الأكواد السرية قريباً!`

    async function ceoModifyMeowBucks(mode = 'give') {
      if (!state.currentUser || !state.currentUser.isOwner) return;
      const uEl = document.getElementById('ceo-target-user');
      const aEl = document.getElementById('ceo-bucks-amount');
      const rawUser = ((uEl ? uEl.value : state.ceoTargetUser) || '').trim().toLowerCase().replace(/^@/, '').replace(/\s+/g, '_');
      if (rawUser) state.ceoTargetUser = rawUser;

      const rawAmount = ((aEl ? aEl.value : state.ceoBucksAmount) || '').trim();
      if (aEl) {
        state.ceoBucksAmount = aEl.value;
      }

      const amount = rawAmount === '' ? NaN : parseInt(rawAmount, 10);

        showToast(state.lang === 'ar' ? '😾 اختر أو اكتب اسم المستخدم المستلم!' : '😾 Please enter or select a recipient username!');
        return;
      }
      if (mode === 'set') {

          return;
        }
      } else {
        if (Number.isNaN(amount) || amount <= 0) {
          showToast(state.lang === 'ar' ? '😾 أدخل كمية صحيحة من Meow Bucks!' : '😾 Please enter a positive Meow Bucks amount!');
          return;
        }
      }

      const targetUsername = (rawUser === 'captain_purr' || rawUser === 'owner') ? 'abood' : rawUser;
      const nowIso = new Date().toISOString();

      if (targetUsername === (state.currentUser.username || 'abood').toLowerCase()) {
        state.currentUser.meowBucks = mode === 'set'
          ? amount
          : (state.currentUser.meowBucks || 0) + amount;
        state.currentUser.meowBucksUpdatedAt = nowIso;
        autoPersistIfEnabled();
        render();
        if (mode === 'set') {
          showToast(
            state.lang === 'ar'
              ? `👑🎯 تم تعيين رصيد حسابك (@${targetUsername}) إلى 💵 ${amount} Meow Bucks من لوحة Cat CEO!`
              : `👑🎯 Set your account (@${targetUsername}) balance to 💵 ${amount} Meow Bucks via Cat CEO Panel!`
          );
        } else {
          showToast(
            state.lang === 'ar'
              ? `👑💵 تم إضافة +${amount} Meow Bucks إلى حسابك (@${targetUsername}) من لوحة Cat CEO!`
              : `👑💵 Added +${amount} Meow Bucks to your account (@${targetUsername}) via Cat CEO Panel!`
          );
        }
        return;
      }

      const accounts = await syncAccountsFromCloud();
      const cloudSnap = await fetchCloudUserSnapshot(targetUsername);
      const acc = accounts[targetUsername];
      const targetSnap = chooseBestSnapshot(acc && acc.snapshot, cloudSnap);

      if (!acc && !targetSnap) {
        showToast(
          state.lang === 'ar'
            ? `😾 الحساب @${targetUsername} غير موجود في النظام بعد!`
            : `😾 Account @${targetUsername} was not found!`
        );
        return;
      }

      const updatedSnap = targetSnap ? { ...targetSnap } : { version: 5, currentUser: { username: targetUsername, displayName: (acc && acc.displayName) || targetUsername, meowCoins: 250, meowBucks: 0 } };
      updatedSnap.savedAt = nowIso;
      if (!updatedSnap.currentUser) updatedSnap.currentUser = { username: targetUsername, meowBucks: 0 };
      updatedSnap.currentUser = {
        ...updatedSnap.currentUser,
        meowBucks: mode === 'set' ? amount : (updatedSnap.currentUser.meowBucks || 0) + amount,
        meowBucksUpdatedAt: nowIso
      };

      const targetStorageKey = getUserStorageKey(targetUsername);

        localStorage.setItem(targetStorageKey, JSON.stringify(updatedSnap));

      accounts[targetUsername] = {
        ...(acc || {}),
        username: targetUsername,
        displayName: updatedSnap.currentUser.displayName || targetUsername,
        avatarEmoji: updatedSnap.currentUser.avatarEmoji || '🐱',
        lastSavedAt: nowIso,
        snapshot: updatedSnap

      fetch(`/api/userdata?key=${encodeURIComponent(targetUsername)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },

    function playSkeletonMemeBeatNote(stepIdx) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!window._skelAudioCtx) window._skelAudioCtx = new AudioCtx();
        const ctx = window._skelAudioCtx;
        if (ctx.state === 'suspended') ctx.resume();
        const notes = [146.83, 174.61, 196.00, 220.00, 196.00, 174.61, 130.81, 146.83];
        const freq = notes[stepIdx % notes.length];
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = stepIdx % 2 === 0 ? 'sawtooth' : 'square';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.06, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.23);
      } catch (e) {}
    }

    function startSkeletonFanMemePlayback() {
      stopSkeletonFanMemePlayback();
      skeletonStartTime = performance.now();
      skeletonQuestTriggered = false;
      let beatStep = 0;
      playSkeletonMemeBeatNote(beatStep++);
      skeletonAudioTimerId = setInterval(() => {
        const canvas = document.getElementById('skeleton-fan-video-canvas');
        if (!canvas) {
          stopSkeletonFanMemePlayback();

        }

      }, 260);

      const durationMs = 5000;
      const tick = (now) => {
        const canvas = document.getElementById('skeleton-fan-video-canvas');
        if (!canvas) {
          stopSkeletonFanMemePlayback();
          return;
        }
        const elapsed = now - skeletonStartTime;
        const pct = Math.min(1, elapsed / durationMs);
        drawSkeletonFanMemeFrame(canvas, elapsed, pct);

        const progFill = document.getElementById('skeleton-video-prog-fill');
        const progText = document.getElementById('skeleton-video-prog-text');
        if (progFill) progFill.style.width = `${Math.round(pct * 100)}%`;
        if (progText) {
          const sec = Math.min(5, (elapsed / 1000)).toFixed(1);
          progText.textContent = `${sec}s / 5.0s`;
        }

        if (pct >= 1 && !skeletonQuestTriggered) {

          incrementQuest('watchSkeletonFan', 1);
          if (!wasIncomplete) {
            showToast(state.lang === 'ar' ? '💀🪭 تمت مشاهدة فيديو ميم الهيكل العظمي والمروحة!' : '💀🪭 Watched the Skeleton Fan Meme video!');
          } else {
            render();
          }
          return;
        }
        skeletonAnimFrameId = requestAnimationFrame(tick);
      };
      skeletonAnimFrameId = requestAnimationFrame(tick);
    }

    function drawSkeletonFanMemeFrame(canvas, elapsedMs, pct) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const t = elapsedMs / 1000;
      const cutIndex = Math.floor(t * 2.2) % 4;

      // Rapid meme camera cuts & background strobe
      const bgColors = [
        ['#1A0B1E', '#4A1230'],
        ['#0F172A', '#1E3A8A'],
        ['#280909', '#7F1D1D'],
        ['#18122B', '#443C68']
      ];
      const pair = bgColors[cutIndex];
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, pair[0]);
      grad.addColorStop(1, pair[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      // Meme camera zoom & tilt per cut
      const zoom = 1 + 0.08 * Math.sin(t * 14);
      const tilt = (cutIndex % 2 === 0 ? 1 : -1) * 0.035 * Math.cos(t * 10);
      ctx.translate(w / 2, h / 2);
      ctx.scale(zoom, zoom);
      ctx.rotate(tilt);
      ctx.translate(-w / 2, -h / 2);

      // Wind speed lines blowing from fan (left) to skeleton (right)
      ctx.strokeStyle = 'rgba(92, 225, 230, 0.45)';
      ctx.lineWidth = 2.5;
      for (let i = 0; i < 14; i++) {
        const wy = 45 + ((i * 21 + elapsedMs * 0.25) % (h - 90));
        const wx = ((elapsedMs * 0.85 + i * 73) % (w - 120)) + 90;
        ctx.beginPath();
        ctx.moveTo(wx, wy);
        ctx.lineTo(wx + 42, wy + Math.sin(t * 12 + i) * 4);
        ctx.stroke();
      }

      // Draw Spinning Electric Fan on Left
      const fanX = 125;
      const fanY = h / 2 + 15;
      ctx.fillStyle = '#334155';
      ctx.fillRect(fanX - 10, fanY + 55, 20, 48);
      ctx.fillRect(fanX - 36, fanY + 95, 72, 12);

      ctx.save();
      ctx.translate(fanX, fanY);
      ctx.rotate(t * 22);
      for (let b = 0; b < 4; b++) {
        ctx.rotate(Math.PI / 2);
        ctx.fillStyle = '#5CE1E6';
        ctx.beginPath();
        ctx.ellipse(0, -34, 15, 34, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      ctx.strokeStyle = '#94A3B8';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(fanX, fanY, 64, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = '#FFD166';
      ctx.beginPath();
      ctx.arc(fanX, fanY, 12, 0, Math.PI * 2);
      ctx.fill();

      // Draw Vibing / Roasting Skeleton on Right being blasted by the Fan
      const skX = 375 + Math.sin(t * 35) * 6;
      const skY = h / 2 + Math.cos(t * 28) * 5;

      // Skeleton Ribcage
      ctx.strokeStyle = '#E2E8F0';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(skX, skY + 45);
      ctx.lineTo(skX, skY + 115);
      ctx.stroke();
      for (let r = 0; r < 3; r++) {
        const ry = skY + 62 + r * 16;
        ctx.beginPath();
        ctx.arc(skX, ry, 28 - r * 3, 0.2 * Math.PI, 0.8 * Math.PI);
        ctx.stroke();
      }

      // Skeleton Skull
      ctx.fillStyle = '#F8FAFC';
      ctx.beginPath();
      ctx.arc(skX, skY - 12, 46, 0, Math.PI * 2);
      ctx.fill();

      // Chattering Skeleton Jaw
      const jawOpen = Math.abs(Math.sin(t * 24)) * 14;
      ctx.fillStyle = '#E2E8F0';
      ctx.fillRect(skX - 24, skY + 22 + jawOpen, 48, 22);

      // Teeth
      ctx.fillStyle = '#0F172A';
      for (let te = -16; te <= 16; te += 8) {
        ctx.fillRect(skX + te - 2, skY + 22 + jawOpen, 3, 10);
      }

      // Glowing Meme Eyes
      ctx.fillStyle = '#0F172A';
      ctx.beginPath();
      ctx.arc(skX - 16, skY - 14, 12, 0, Math.PI * 2);
      ctx.arc(skX + 16, skY - 14, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = cutIndex % 2 === 0 ? '#FF6B6B' : '#FFD166';
      ctx.beginPath();
      ctx.arc(skX - 16, skY - 14, 5, 0, Math.PI * 2);
      ctx.arc(skX + 16, skY - 14, 5, 0, Math.PI * 2);
      ctx.fill();

      // Nose cavity
      ctx.fillStyle = '#0F172A';
      ctx.beginPath();
      ctx.moveTo(skX, skY - 2);
      ctx.lineTo(skX - 6, skY + 10);
      ctx.lineTo(skX + 6, skY + 10);
      ctx.closePath();
      ctx.fill();

      ctx.restore();

      // Meme Impact Captions Top & Bottom
      const captions = [
        ['AVERAGE SKELETON FAN MEME', '💀🪭 MAXIMUM FAN VELOCITY'],
        ['WHEN THE FAN HITS AT 3:00 AM', '💀 *RATTLING INTENSIFIES*'],
        ['SKELETON FAN ENJOYER', '🪭💨 BONE-CHILLING BREEZE'],
        ['CERTIFIED SKELETON CLASSIC', '🪙 +30 MEOWCOINS QUEST']
      ];
      const cap = captions[cutIndex];
      ctx.font = '900 18px Nunito, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#000000';
      ctx.fillText(cap[0], w / 2 + 2, 32);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(cap[0], w / 2, 30);

      ctx.font = '900 16px Nunito, sans-serif';
      ctx.fillStyle = '#000000';
      ctx.fillText(cap[1], w / 2 + 2, h - 16);
      ctx.fillStyle = '#FFD166';
      ctx.fillText(cap[1], w / 2, h - 18);
    }

    function isUserPremiumActive(user = state.currentUser) {
      if (!user) return false;
      if (user.isOwner || user.premiumLifetime) return true;
      if (!user.isPremium) return false;
      if (!user.premiumExpiresAt) return true;
      const exp = Date.parse(user.premiumExpiresAt);
      return Number.isFinite(exp) && exp > Date.now();
    }

    function getUserPremiumTier(user = state.currentUser) {
      if (!isUserPremiumActive(user)) return 'none';
      const explicit = String(user.premiumTier || '').toLowerCase();
      if (explicit === 'business' || explicit === 'basic' || explicit === 'standard') {
        return explicit;
      }
      const plan = String(user.premiumPlan || '').toLowerCase();
      if (plan.includes('business')) return 'business';
      if (plan.includes('basic')) return 'basic';
      return 'standard';
    }

    function hasStandardOrBusinessPremium(user = state.currentUser) {
      const tier = getUserPremiumTier(user);
      return tier === 'standard' || tier === 'business';
    }

    function getPremiumDaysRemaining(user = state.currentUser) {
      if (!isUserPremiumActive(user)) return 0;
      if (user.premiumLifetime || (user.isOwner && !user.premiumExpiresAt)) return Infinity;
      if (!user.premiumExpiresAt) return Infinity;
      const ms = Date.parse(user.premiumExpiresAt) - Date.now();
      return Math.max(1, Math.ceil(ms / 86400000));
    }

    function getPremiumBadgeLabel(user = state.currentUser) {
      const tier = getUserPremiumTier(user);
      if (tier === 'none') return '';
      const rem = getPremiumDaysRemaining(user);
      const suffix = Number.isFinite(rem) ? ` (${rem}d)` : (user.premiumLifetime ? ' LIFETIME' : '');
      if (tier === 'business') return `🏢 BUSINESS${suffix}`;
      if (tier === 'basic') return `💠 BASIC${suffix}`;
      return `💎${suffix || ' VIP'}`;
    }

    function isMarkerUnlockedForUser(marker, user = state.currentUser) {
      if (!marker) return false;
      if (marker.priceCoins === 0) return true;
      const owned = Array.isArray(user && user.unlockedMarkers) ? user.unlockedMarkers : ['marker_white'];
      if (owned.includes(marker.id)) return true;
      const tier = getUserPremiumTier(user);
      const rank = { none: 0, basic: 1, standard: 2, business: 3 };
      const reqRank = rank[marker.tierRequired || ''] || 99;
      return rank[tier] >= reqRank;
    }

    function getUserPremiumDiscountPercent(user = state.currentUser) {
      const tier = getUserPremiumTier(user);
      if (tier === 'business') return 16;
      if (tier === 'standard') return 16;
      if (tier === 'basic') return 8;
      return 0;
    }

    function getBiweeklyCoinsStatus(user = state.currentUser) {
      if (!hasStandardOrBusinessPremium(user)) {
        return { eligible: false, canClaim: false, daysLeft: 14, hoursLeft: 0 };
      }
      const lastMs = user.lastBiweeklyCoinsClaimAt ? (Date.parse(user.lastBiweeklyCoinsClaimAt) || 0) : 0;
      const cooldownMs = 14 * 86400000;
      const diff = Date.now() - lastMs;
      if (!lastMs || diff >= cooldownMs) {
        return { eligible: true, canClaim: true, daysLeft: 0, hoursLeft: 0 };
      }
      const remMs = cooldownMs - diff;
      const daysLeft = Math.floor(remMs / 86400000);
      const hoursLeft = Math.floor((remMs % 86400000) / 3600000);
      return { eligible: true, canClaim: false, daysLeft, hoursLeft };
    }

    function claimBiweeklyPremiumCoins() {
      const status = getBiweeklyCoinsStatus();
      if (!status.eligible || !status.canClaim) return;
      state.currentUser.meowCoins = (state.currentUser.meowCoins || 0) + 35;
      state.currentUser.lastBiweeklyCoinsClaimAt = new Date().toISOString();
      autoPersistIfEnabled();
      render();
      showToast(
        state.lang === 'ar'
          ? '🎁🪙 تم استلام +35 عملة مياو مجانية (ميزة الاشتراك كل أسبوعين)!'
          : '🎁🪙 Claimed +35 Free MeowCoins (Bi-Weekly Subscription Perk)!'
      );
    }

      return `

      return basePrice;

    function getTodayDateKey() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    const DAILY_CAT_PUZZLES = [
      { id: 'cat_blep', title: 'Silver Tabby Kitten 🐾', src: '/puzzle_cat_1.jpg' },
      { id: 'cat_fluffy', title: 'Fluffy Tabby Kitten 🤍', src: '/puzzle_cat_2.jpg' },
      { id: 'cat_ginger', title: 'Cozy Ginger Kitten 🧡', src: '/puzzle_cat_3.jpg' }
    ];

    function getTodaysChosenPuzzleSpec() {
      const todayKey = getTodayDateKey();
      const userChoiceDate = state.currentUser && state.currentUser.dailyPuzzleChoiceDate;
      const userChoiceId = state.currentUser && state.currentUser.dailyPuzzleChoiceId;
      if (userChoiceDate === todayKey && userChoiceId) {
        return DAILY_CAT_PUZZLES.find(p => p.id === userChoiceId) || null;
      }
      return null;
    }

    function createShuffledPuzzleBoard() {
      const board = [0, 1, 2, 3, 4, 5, 6, 7, 8];
      for (let i = board.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = board[i];
        board[i] = board[j];
        board[j] = tmp;
      }
      if (board.every((v, idx) => v === idx)) {
        [board[0], board[4]] = [board[4], board[0]];
        [board[2], board[7]] = [board[7], board[2]];
      }
      return board;
    }

    function openDailyCatPuzzle() {
      const chosen = getTodaysChosenPuzzleSpec();
      const todayKey = getTodayDateKey();
      if (chosen) {
        if (!state.dailyPuzzle || state.dailyPuzzle.dateKey !== todayKey || state.dailyPuzzle.puzzleId !== chosen.id) {
          state.dailyPuzzle = {
            dateKey: todayKey,
            puzzleId: chosen.id,
            board: createShuffledPuzzleBoard(),
            selectedPos: null,
            moves: 0,
            solved: false,
            showPeek: false
          };
        }
      } else {
        state.dailyPuzzle = null;
      }
      state.modal = 'dailyPuzzle';
      render();
    }

    function selectDailyCatPuzzle(puzzleId) {
      const spec = DAILY_CAT_PUZZLES.find(p => p.id === puzzleId);
      if (!spec) return;
      const todayKey = getTodayDateKey();
      state.currentUser.dailyPuzzleChoiceDate = todayKey;
      state.currentUser.dailyPuzzleChoiceId = spec.id;
      state.dailyPuzzle = {
        dateKey: todayKey,
        puzzleId: spec.id,
        board: createShuffledPuzzleBoard(),
        selectedPos: null,
        moves: 0,
        solved: false,
        showPeek: false
      };
      autoPersistIfEnabled();
      render();
    }

    function clearDailyCatChoiceForToday() {
      const todayKey = getTodayDateKey();
      if ((state.dailyPuzzle && state.dailyPuzzle.solved) || state.currentUser.lastDailyPuzzleRewardDate === todayKey) {
        return;
      }
      state.currentUser.dailyPuzzleChoiceDate = null;
      state.currentUser.dailyPuzzleChoiceId = null;
      state.dailyPuzzle = null;
      autoPersistIfEnabled();
      render();
    }

    function resetDailyCatPuzzle() {
      const chosen = getTodaysChosenPuzzleSpec();
      if (!chosen) {
        state.dailyPuzzle = null;
        render();
        return;
      }
      state.dailyPuzzle = {
        dateKey: getTodayDateKey(),
        puzzleId: chosen.id,
        board: createShuffledPuzzleBoard(),
        selectedPos: null,
        moves: 0,
        solved: false,
        showPeek: false
      };
      render();
    }

    function toggleDailyPuzzlePeek() {
      if (!state.dailyPuzzle) return;
      state.dailyPuzzle.showPeek = !state.dailyPuzzle.showPeek;
      render();
    }

    function clickDailyPuzzleTile(posIdx) {
      if (!state.dailyPuzzle || state.dailyPuzzle.solved) return;
      if (state.dailyPuzzle.selectedPos === null) {
        state.dailyPuzzle.selectedPos = posIdx;
        render();
        return;
      }
      if (state.dailyPuzzle.selectedPos === posIdx) {
        state.dailyPuzzle.selectedPos = null;
        render();
        return;
      }
      const a = state.dailyPuzzle.selectedPos;
      const b = posIdx;
      [state.dailyPuzzle.board[a], state.dailyPuzzle.board[b]] = [state.dailyPuzzle.board[b], state.dailyPuzzle.board[a]];
      state.dailyPuzzle.selectedPos = null;
      state.dailyPuzzle.moves += 1;

      const isNowSolved = state.dailyPuzzle.board.every((v, i) => v === i);
      if (isNowSolved) {
        state.dailyPuzzle.solved = true;
        const todayKey = getTodayDateKey();
        if (state.currentUser.lastDailyPuzzleRewardDate !== todayKey) {
          state.currentUser.lastDailyPuzzleRewardDate = todayKey;
          state.currentUser.meowCoins = (state.currentUser.meowCoins || 0) + 5;
          autoPersistIfEnabled();
          render();
          showToast(
            state.lang === 'ar'
              ? '🧩🐱 أحسنت! أكملت لغز القطة الصغيرة اليوم وحصلت على +5 🪙 عملات مياو!'
              : state.lang === 'zh'
              ? '🧩🐱 太棒了！完成了今天的每日小猫拼图，获得 +5 🪙 喵币！'
              : state.lang === 'ru'
              ? '🧩🐱 Мяурфектно! Вы решили пазл с котёнком дня и получили +5 🪙 МяуКоинов!'
              : '🧩🐱 Purrfect! Completed today\'s Kitten Puzzle for +5 🪙 MeowCoins!'
          );
          return;
        }
        render();
        showToast(
          state.lang === 'ar'
            ? '🧩✨ أكملت اللغز بنجاح! تم استلام مكافأة اليوم (+5 🪙) مسبقاً — عد غداً!'
            : '🧩✨ Puzzle solved! Today\'s +5 🪙 reward was already claimed — come back tomorrow!'
        );
        return;
      }

      render();

    function getEffectiveQuestReward(baseReward) {
      return baseReward;
    }

    function claimAllReadyQuests() {
      const claimable = state.quests.filter(q => q.currentProgress >= q.targetCount && !q.isClaimed);
      if (claimable.length === 0) return;
      let totalEarned = 0;
      for (const q of claimable) {
        q.isClaimed = true;
        const reward = getEffectiveQuestReward(q.rewardCoins);
        state.currentUser.meowCoins += reward;
        totalEarned += reward;
      }
      autoPersistIfEnabled();
      showToast(
        state.lang === 'ar'
          ? `⚡🪙 تم استلام ${claimable.length} مهام دفعة واحدة (+${totalEarned} عملة مياو)!`
          : `⚡🪙 Claimed ${claimable.length} quests at once (+${totalEarned} MeowCoins)!`
      );
    }

    function selectOrUnlockMarker(markerId) {
      const marker = WHITEBOARD_MARKERS.find(m => m.id === markerId);
      if (!marker) return;
      if (!Array.isArray(state.currentUser.unlockedMarkers)) {
        state.currentUser.unlockedMarkers = ['marker_white'];
      }
      const owned = isMarkerUnlockedForUser(marker);
      if (owned) {
        state.activeMarkerId = marker.id;
        state.whiteboardTool = 'pen';
        autoPersistIfEnabled();
        render();
        setTimeout(initWhiteboardCanvas, 20);
        return;
      }
      const effectiveCost = getEffectiveCoinPrice(marker.priceCoins);
      if (state.currentUser.meowCoins < effectiveCost) {
        showToast(state.lang === 'ar' ? `😾 تحتاج إلى ${effectiveCost} عملة مياو لفتح هذا القلم!` : `😾 Need ${effectiveCost} MeowCoins to unlock ${marker.name}!`);
        return;
      }
      state.currentUser.meowCoins -= effectiveCost;
      state.currentUser.unlockedMarkers.push(marker.id);
      state.activeMarkerId = marker.id;
      state.whiteboardTool = 'pen';
      autoPersistIfEnabled();
      showToast(state.lang === 'ar' ? `🎨 تم فتح ${marker.nameAr} مقابل ${effectiveCost} عملة مياو!` : `🎨 Unlocked ${marker.name} for ${effectiveCost} MeowCoins!`);
      setTimeout(initWhiteboardCanvas, 20);
    }

    function sendMessage(contentText, stickerId = null, singleEmoji = null) {
      const trimmed = (contentText || '').trim();
      if (!trimmed && !stickerId && !singleEmoji) return;

      const key = getActiveChannelKey();
      if (!state.messagesByChannel[key]) state.messagesByChannel[key] = [];

      const isDm = state.navMode === 'dms' && state.dmSubView === 'conversation';
      const canBusinessAnnounce = getUserPremiumTier() === 'business';
      const newMsg = {
        id: 'm_' + Date.now(),
        senderId: state.currentUser.id,
        senderName: state.currentUser.displayName,
        senderAvatar: state.currentUser.avatarEmoji,
        senderRoleColor: state.currentUser.roleColor,
        senderIsOwner: !!state.currentUser.isOwner,
        senderBadge: state.currentUser.equippedBadge,
        isBusinessAnnouncement: canBusinessAnnounce && !!state.businessAnnouncementMode,
        content: trimmed,
        stickerId: stickerId,
        singleEmoji: singleEmoji,
        replyToSenderName: state.replyingTo ? state.replyingTo.senderName : null,
        replyToPreview: state.replyingTo ? (state.replyingTo.content || '[Cat Emoji]') : null,
        reactions: {},
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        isPinned: false
      };

      state.messagesByChannel[key].push(newMsg);
      const wasReply = !!state.replyingTo;
      state.replyingTo = null;
      state.showStickerPicker = false;

      incrementQuest('sendMessages', 1);
      if (stickerId) incrementQuest('sendSticker', 1);
      if (wasReply) incrementQuest('replyMessage', 1);
      if (isDm) incrementQuest('sendDm', 1);

      autoPersistIfEnabled();

      fetch(`/api/messages?channelId=${encodeURIComponent(key)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newMsg)
      }).catch(() => {});

      render();
      scrollToBottom();

      // Playful Meow AI Reply
      setTimeout(() => {
        const responder = (isDm && state.users[state.selectedDmUserId])
          ? state.users[state.selectedDmUserId]
          : (state.users.user_meow_ai || getDefaultMeowAiUser());
        if (!responder) return;

        const repliesEn = [
          `Meow AI here! 🤖🐾 Pawsitively agreed, @${state.currentUser.displayName}! Let's celebrate with extra tuna!`,
          `Beep-purr! 🤖🎶 *Meow AI vibrates at 45Hz purr frequency* How can I help you in the Castle today?`,
          `Meow AI scan complete: 100% certified awesome cat message! 🐟🤖`,
          `10/10 take, @${state.currentUser.displayName}! Awarding you maximum purrs from Meow AI 🍞👑`
        ];
        const repliesAr = [
          `معك Meow AI! 🤖🐾 أتفق معك تماماً @${state.currentUser.displayName}! لنحتفل بوجبة تونة فاخرة!`,
          `مياو-بيب! 🤖🎶 *Meow AI يعمل بتردد خرخرة 45 هرتز* كيف يمكنني مساعدتك في القلعة اليوم؟`,
          `اكتمل فحص Meow AI: رسالة قطة رائعة بنسبة 100%! 🐟🤖`,
          `كلام حكيم 10/10 يا @${state.currentUser.displayName}! تحياتي من Meow AI 🍞👑`
        ];
        const pool = state.lang === 'ar' ? repliesAr : repliesEn;

        const botMsg = {
          id: 'm_bot_' + Date.now(),
          senderId: responder.id,
          senderName: responder.displayName,
          senderAvatar: responder.avatarEmoji,
          senderRoleColor: responder.roleColor,
          senderBadge: responder.equippedBadge,
          content: pool[Math.floor(Math.random() * pool.length)],
          replyToSenderName: state.currentUser.displayName,
          replyToPreview: trimmed || '[Cat Sticker]',
          reactions: { '🐾': [responder.id] },
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          isPinned: false
        };
        state.messagesByChannel[key].push(botMsg);
        autoPersistIfEnabled();
        render();
        scrollToBottom();
      }, 1100);
    }

    function toggleReaction(msgId, emoji) {
      const key = getActiveChannelKey();
      const list = state.messagesByChannel[key] || [];
      const msg = list.find(m => m.id === msgId);
      if (!msg) return;

      if (!msg.reactions[emoji]) msg.reactions[emoji] = [];
      const idx = msg.reactions[emoji].indexOf(state.currentUser.id);
      if (idx >= 0) {
        msg.reactions[emoji].splice(idx, 1);
        if (msg.reactions[emoji].length === 0) delete msg.reactions[emoji];
      } else {
        msg.reactions[emoji].push(state.currentUser.id);
        incrementQuest('addReactions', 1);
      }
      autoPersistIfEnabled();
      render();
    }

    function togglePin(msgId) {
      const key = getActiveChannelKey();
      const list = state.messagesByChannel[key] || [];
      const msg = list.find(m => m.id === msgId);
      if (!msg) return;
      msg.isPinned = !msg.isPinned;
      autoPersistIfEnabled();
      showToast(msg.isPinned ? '📌 Pinned!' : '📌 Unpinned.');
    }

    function claimQuest(questId) {
      const q = state.quests.find(x => x.id === questId);
      if (!q || q.currentProgress < q.targetCount || q.isClaimed) return;
      q.isClaimed = true;
      const reward = getEffectiveQuestReward(q.rewardCoins);
      state.currentUser.meowCoins += reward;
      autoPersistIfEnabled();
      const title = state.lang === 'ar' ? q.titleAr : q.title;
      showToast(`🪙 +${reward} ${t().meowCoins} (${title})!`);
    }

    function unlockOrSendSticker(stickerId, fromChat = false, chosenEmoji = null) {
      const sticker = STICKERS.find(s => s.id === stickerId);
      if (!sticker) return;
      const owned = state.currentUser.unlockedStickerIds.includes(sticker.id);
      if (owned) {
        if (fromChat) {
          sendMessage('', sticker.id, chosenEmoji || sticker.emojis[0]);
        }
        return;
      }
      const effectiveCost = getEffectiveCoinPrice(sticker.priceCoins);
      if (state.currentUser.meowCoins < effectiveCost) {
        showToast(state.lang === 'ar' ? `😾 تحتاج إلى ${effectiveCost} عملة مياو!` : `😾 Need ${effectiveCost} MeowCoins!`);
        return;
      }
      state.currentUser.meowCoins -= effectiveCost;
      state.currentUser.unlockedStickerIds.push(sticker.id);
      autoPersistIfEnabled();
      showToast(`🎉 Unlocked "${state.lang === 'ar' ? sticker.nameAr : sticker.name}" for ${effectiveCost} 🪙!`);
    }

    function buyOrEquipBadge(badgeTitle, priceCoins) {
      const owned = state.currentUser.unlockedBadges.includes(badgeTitle);
      if (owned) {
        state.currentUser.equippedBadge = badgeTitle;
        autoPersistIfEnabled();
        showToast(`✨ ${badgeTitle}`);
        return;
      }
      const effectiveCost = getEffectiveCoinPrice(priceCoins);
      if (state.currentUser.meowCoins < effectiveCost) {
        showToast(state.lang === 'ar' ? `😾 تحتاج إلى ${effectiveCost} عملة مياو!` : `😾 Need ${effectiveCost} MeowCoins!`);
        return;
      }
      state.currentUser.meowCoins -= effectiveCost;
      state.currentUser.unlockedBadges.push(badgeTitle);
      state.currentUser.equippedBadge = badgeTitle;
      autoPersistIfEnabled();
      showToast(`👑 ${badgeTitle} (${effectiveCost} 🪙)!`);
    }

    function cyclePresence() {
      const order = [
        { label: 'Purring', color: '#43B581' },
        { label: 'Catnapping', color: '#FAA61A' },
        { label: 'Hissing', color: '#F04747' },
        { label: 'Stray', color: '#747F8D' }
      ];
      const curIdx = order.findIndex(o => o.label === state.currentUser.presence);
      const next = order[(curIdx + 1) % order.length];
      state.currentUser.presence = next.label;
      state.currentUser.presenceColor = next.color;
      autoPersistIfEnabled();
      showToast(`🐾 ${t().presenceLabels[next.label] || next.label}`);
    }

    let isDrawingWhiteboard = false;
    let currentStroke = null;

    function initWhiteboardCanvas() {
      const canvas = document.getElementById('cat-whiteboard-canvas');
      const stage = document.getElementById('whiteboard-stage');
      if (!canvas || !stage) return;

      const rect = stage.getBoundingClientRect();
      canvas.width = Math.max(600, Math.floor(rect.width));
      canvas.height = Math.max(360, Math.floor(rect.height));

      redrawWhiteboardCanvas(canvas);

      canvas.onpointerdown = (e) => {
        isDrawingWhiteboard = true;
        const r = canvas.getBoundingClientRect();
        const x = e.clientX - r.left;
        const y = e.clientY - r.top;
        const markerObj = WHITEBOARD_MARKERS.find(m => m.id === state.activeMarkerId) || WHITEBOARD_MARKERS[0];
        const strokeColor = state.whiteboardTool === 'eraser' ? '#181523' : markerObj.colorHex;
        const strokeSize = state.whiteboardTool === 'eraser' ? 22 : state.whiteboardBrushSize;
        currentStroke = { color: strokeColor, size: strokeSize, points: [{ x, y }] };
        state.whiteboardStrokes.push(currentStroke);
        redrawWhiteboardCanvas(canvas);
      };

      canvas.onpointermove = (e) => {
        if (!isDrawingWhiteboard || !currentStroke) return;
        const r = canvas.getBoundingClientRect();
        const x = e.clientX - r.left;
        const y = e.clientY - r.top;
        currentStroke.points.push({ x, y });
        redrawWhiteboardCanvas(canvas);
      };

      const finishStroke = () => {
        if (isDrawingWhiteboard) {
          isDrawingWhiteboard = false;
          currentStroke = null;
          autoPersistIfEnabled();
        }
      };
      canvas.onpointerup = finishStroke;
      canvas.onpointerleave = finishStroke;
    }

    function redrawWhiteboardCanvas(canvas) {
      if (!canvas) canvas = document.getElementById('cat-whiteboard-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      for (let gx = 24; gx < canvas.width; gx += 28) {
        for (let gy = 24; gy < canvas.height; gy += 28) {
          ctx.fillRect(gx, gy, 2, 2);
        }
      }

      for (const st of state.whiteboardStrokes) {
        if (!st.points || st.points.length === 0) continue;
        ctx.strokeStyle = st.color || '#FFFFFF';
        ctx.lineWidth = st.size || 5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(st.points[0].x, st.points[0].y);
        for (let i = 1; i < st.points.length; i++) {
          ctx.lineTo(st.points[i].x, st.points[i].y);
        }
        if (st.points.length === 1) {
          ctx.lineTo(st.points[0].x + 0.5, st.points[0].y + 0.5);
        }
        ctx.stroke();
      }
    }

    function undoWhiteboardStroke() {
      state.whiteboardStrokes.pop();
      autoPersistIfEnabled();
      redrawWhiteboardCanvas();
    }

    function clearWhiteboard() {
      state.whiteboardStrokes = [];
      autoPersistIfEnabled();
      redrawWhiteboardCanvas();
    }

    function stampCatOnWhiteboard() {
      const markerObj = WHITEBOARD_MARKERS.find(m => m.id === state.activeMarkerId) || WHITEBOARD_MARKERS[0];
      const cx = 180 + Math.floor(Math.random() * 260);
      const cy = 120 + Math.floor(Math.random() * 140);
      state.whiteboardStrokes.push({
        color: markerObj.colorHex,
        size: state.whiteboardBrushSize,
        points: [
          { x: cx - 45, y: cy - 10 }, { x: cx - 32, y: cy - 48 }, { x: cx - 14, y: cy - 22 },
          { x: cx + 14, y: cy - 22 }, { x: cx + 32, y: cy - 48 }, { x: cx + 45, y: cy - 10 },
          { x: cx + 48, y: cy + 32 }, { x: cx, y: cy + 50 }, { x: cx - 48, y: cy + 32 }, { x: cx - 45, y: cy - 10 }
        ]
      });
      autoPersistIfEnabled();
      redrawWhiteboardCanvas();
    }

    async function addFriendFromInput() {
      const el = document.getElementById('new-friend-input');
      if (!el || !el.value.trim()) {
        showToast(state.lang === 'ar' ? '😾 أدخل اسم مستخدم أو بريد إلكتروني لحساب موجود!' : '😾 Please enter an existing CatMsg username or email!');
        return;
      }
      const rawQuery = el.value.trim();
      const normalized = rawQuery.toLowerCase().replace(/^@/, '').replace(/\s+/g, '_');
      const emailLookup = rawQuery.toLowerCase();

      const myUsername = (state.currentUser.username || '').toLowerCase();
      const myEmail = (state.currentUser.googleEmail || (state.currentUser.isOwner ? OWNER_EMAIL : '')).toLowerCase();
      if (normalized === myUsername || (myEmail && emailLookup === myEmail)) {
        showToast(state.lang === 'ar' ? '😸 هذا هو حسابك الشخصي!' : '😸 You cannot add your own account as a friend!');
        return;
      }

      // 1. Official Meow AI account support if deleted and re-added
      if (normalized === 'meow_ai' || normalized === 'meowai') {
        const already = state.users.user_meow_ai;
        if (already) {
          showToast('🐾 @meow_ai is already in your Cat Friends list!');
          return;
        }
        state.users.user_meow_ai = getDefaultMeowAiUser();
        state.currentUser.removedFriendIds = (state.currentUser.removedFriendIds || []).filter(fid => fid !== 'user_meow_ai');
        if (!Array.isArray(state.currentUser.friendIds)) state.currentUser.friendIds = [];
        if (!state.currentUser.friendIds.includes('user_meow_ai')) state.currentUser.friendIds.push('user_meow_ai');
        el.value = '';
        autoPersistIfEnabled();
        render();
        showToast('🎉 Added @meow_ai to your Cat Friends!');
        return;
      }

      // 2. Sync existing accounts from cloud (Supabase) & check username or email
      const accounts = await syncAccountsFromCloud();
      let matchedAcc = null;
      let matchedKey = null;

      if (emailLookup === OWNER_EMAIL.toLowerCase() || emailLookup === 'abood@gmail.com' || normalized === 'abood' || normalized === 'captain_purr') {
        matchedKey = 'abood';
        matchedAcc = accounts['abood'] || accounts['captain_purr'] || {
          username: 'abood',
          displayName: 'abood',
          avatarEmoji: '🐱',
          isOwner: true,
          googleEmail: OWNER_EMAIL
        };
      } else {
        for (const [k, a] of Object.entries(accounts)) {
          if (!a || typeof a !== 'object') continue;
          const u = String(a.username || k || '').toLowerCase().trim();
          const accEmail = String(a.googleEmail || (a.snapshot && a.snapshot.currentUser && a.snapshot.currentUser.googleEmail) || '').toLowerCase().trim();
          if (u === normalized || (accEmail && accEmail === emailLookup)) {
            matchedKey = u;
            matchedAcc = a;
            break;
          }
        }
      }

      // Also check direct snapshot endpoint by username in case account exists outside local registry cache
      if (!matchedAcc && !emailLookup.includes('@')) {
        const directSnap = await fetchCloudUserSnapshot(normalized);
        if (directSnap && directSnap.currentUser && directSnap.currentUser.username) {
          matchedKey = directSnap.currentUser.username.toLowerCase();
          matchedAcc = {
            username: matchedKey,
            displayName: directSnap.currentUser.displayName || matchedKey,
            avatarEmoji: directSnap.currentUser.avatarEmoji || '🐱',
            isOwner: !!directSnap.currentUser.isOwner,
            googleEmail: directSnap.currentUser.googleEmail || '',
            snapshot: directSnap
          };
        }
      }

      if (!matchedAcc || !matchedKey) {
        showToast(
          state.lang === 'ar'
            ? `😾 لم يتم العثور على حساب CatMsg موجود باسم أو بريد "${rawQuery}"!`
            : `😾 No existing CatMsg account found matching username or email "${rawQuery}"!`
        );
        return;
      }

      const snapU = (matchedAcc.snapshot && matchedAcc.snapshot.currentUser) || {};
      const friendId = (matchedKey === 'abood')
        ? 'user_captain'
        : (snapU.id || `user_acc_${matchedKey}`);

      const duplicate = Object.values(state.users).find(u =>
        u && (u.id === friendId || String(u.username || '').toLowerCase() === matchedKey)
      );
      if (duplicate) {
        showToast(
          state.lang === 'ar'
            ? `🐾 @${matchedKey} موجود بالفعل في قائمة أصدقائك!`
            : `🐾 @${matchedKey} is already in your Cat Friends list!`
        );
        return;
      }

      state.users[friendId] = {
        id: friendId,
        username: matchedKey,
        displayName: snapU.displayName || matchedAcc.displayName || matchedKey,
        googleEmail: snapU.googleEmail || matchedAcc.googleEmail || '',
        avatarEmoji: (matchedAcc.isOwner && !snapU.avatarManuallyCustomized) ? '🐱' : (snapU.avatarEmoji || matchedAcc.avatarEmoji || '🐱'),
        avatarColorHex: snapU.avatarColorHex || '#5CE1E6',
        presence: snapU.presence || 'Purring',
        presenceColor: snapU.presenceColor || '#43B581',
        customStatus: snapU.customStatus || 'CatMsg Member 🐾',
        roleTitle: snapU.roleTitle || (matchedAcc.isOwner ? 'Owner' : 'Cat Member'),
        roleColor: snapU.roleColor || (matchedAcc.isOwner ? '#FFD166' : '#43D9AD'),
        equippedBadge: snapU.equippedBadge || (matchedAcc.isOwner ? '👑 Supreme Loaf' : '🐾 CatMsg Friend'),
        bio: snapU.bio || `CatMsg friend (@${matchedKey}).`
      };

      state.currentUser.removedFriendIds = (state.currentUser.removedFriendIds || []).filter(fid => fid !== friendId);
      if (!Array.isArray(state.currentUser.friendIds)) state.currentUser.friendIds = [];
      if (!state.currentUser.friendIds.includes(friendId)) state.currentUser.friendIds.push(friendId);

      el.value = '';
      autoPersistIfEnabled();
      render();
      showToast(
        state.lang === 'ar'
          ? `🎉 تمت إضافة الصديق @${matchedKey} بنجاح!`
          : `🎉 Added existing CatMsg user @${matchedKey} to Cat Friends!`
      );
    }

    function removeFriend(friendId) {

      const disp = target.username ? `@${target.username}` : target.displayName;
      delete state.users[friendId];
      state.currentUser.friendIds = (state.currentUser.friendIds || []).filter(fid => fid !== friendId);
      const removed = Array.isArray(state.currentUser.removedFriendIds) ? state.currentUser.removedFriendIds : [];

        const remainingIds = Object.keys(state.users);

      render();

          : `🗑️ Removed ${disp} from your Cat Friends list.`
      );
    }
