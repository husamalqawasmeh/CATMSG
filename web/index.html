<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CatMsg (PurrCord) — Cat-Themed Discord Messaging</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#14121D" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>😼</text></svg>" />
  <style>
    :root {
      --rail-bg: #14121D;
      --sidebar-bg: #1D1A2B;
      --pod-bg: #171422;
      --feed-bg: #252136;
      --input-bg: #322C47;
      --card-bg: #2D2841;
      --card-hover: #393252;
      --paw-pink: #FF7EB6;
      --purrple: #9D7BFF;
      --gold: #FFD166;
      --mint: #43D9AD;
      --coral: #FF6B6B;
      --yarn-blue: #5CE1E6;
      --text-primary: #F4F1FA;
      --text-secondary: #B5AFC7;
      --text-muted: #7C7594;
      --border: rgba(255, 255, 255, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--feed-bg);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .app-shell {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* 1. SERVER RAIL */
    .server-rail {
      width: 74px;
      background: var(--rail-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 10px;
      flex-shrink: 0;
      z-index: 30;
    }

    .rail-divider {
      width: 34px;
      height: 2px;
      background: var(--border);
      margin: 2px 0;
    }

    .rail-btn-wrap {
      position: relative;
      width: 74px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .rail-pill {
      position: absolute;
      inset-inline-start: 0;
      width: 4px;
      height: 0;
      background: var(--paw-pink);
      border-radius: 4px;
      transition: all 0.18s ease;
    }

    .rail-btn-wrap:hover .rail-pill {
      height: 20px;
    }

    .rail-btn-wrap.active .rail-pill {
      height: 38px;
    }

    .rail-btn {
      width: 48px;
      height: 48px;
      border-radius: 24px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      cursor: pointer;
      transition: all 0.18s ease;
      position: relative;
    }

    .rail-btn:hover,
    .rail-btn-wrap.active .rail-btn {
      border-radius: 16px;
      background: rgba(255, 126, 182, 0.22);
      border-color: var(--paw-pink);
    }

    .rail-badge {
      position: absolute;
      top: -4px;
      inset-inline-end: -4px;
      background: var(--coral);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 10px;
      border: 2px solid var(--rail-bg);
    }

    /* 2. CHANNEL / DM SIDEBAR */
    .channel-sidebar {
      width: 254px;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      border-inline-end: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-header {
      height: 54px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      font-weight: 800;
      font-size: 15px;
      background: linear-gradient(135deg, rgba(255, 126, 182, 0.16), transparent);
    }

    .quest-mini-banner {
      margin: 10px 10px 4px;
      padding: 10px 12px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(255, 209, 102, 0.18), rgba(157, 123, 255, 0.18));
      border: 1px solid rgba(255, 209, 102, 0.45);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .quest-mini-banner:hover {
      transform: translateY(-1px);
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .cat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 6px 4px;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .chan-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 2px;
      transition: background 0.15s;
    }

    .chan-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
    }

    .chan-item.active {
      background: rgba(255, 126, 182, 0.18);
      color: var(--text-primary);
      font-weight: 700;
    }

    .user-pod {
      padding: 10px;
      background: var(--pod-bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-wrap {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 126, 182, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .status-dot {
      position: absolute;
      inset-inline-end: -1px;
      bottom: -1px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--pod-bg);
    }

    /* OWNER TAG */
    .owner-tag {
      background: linear-gradient(135deg, #FFD166, #FF9F1C);
      color: #14121D;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      box-shadow: 0 0 10px rgba(255, 209, 102, 0.45);
      display: inline-flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    /* 3. CENTER MAIN VIEW */
    .main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--feed-bg);
      min-width: 0;
    }

    .top-bar {
      height: 54px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .topic-text {
      color: var(--text-muted);
      font-size: 12.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      border-inline-start: 1px solid var(--border);
      padding-inline-start: 12px;
      margin-inline-start: 4px;
    }

    .coin-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 209, 102, 0.16);
      border: 1px solid rgba(255, 209, 102, 0.45);
      color: var(--gold);
      padding: 5px 11px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 12.5px;
      cursor: pointer;
    }

    .save-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(67, 217, 173, 0.15);
      border: 1px solid rgba(67, 217, 173, 0.45);
      color: var(--mint);
      padding: 5px 10px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }

    .save-pill:hover {
      background: rgba(67, 217, 173, 0.26);
    }

    .lang-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(157, 123, 255, 0.16);
      border: 1px solid rgba(157, 123, 255, 0.45);
      color: var(--text-primary);
      padding: 5px 10px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .lang-pill:hover {
      background: rgba(157, 123, 255, 0.28);
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 17px;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
    }

    .messages-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      user-select: text;
    }

    .welcome-card {
      padding: 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255, 126, 182, 0.12), rgba(157, 123, 255, 0.08));
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .msg-item {
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
      transition: background 0.12s;
    }

    .msg-item:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .msg-item.pinned {
      border: 1px solid rgba(255, 209, 102, 0.35);
    }

    .reply-line {
      font-size: 12px;
      color: var(--text-muted);
      margin-inline-start: 16px;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .msg-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .badge-tag {
      background: rgba(157, 123, 255, 0.2);
      border: 1px solid rgba(157, 123, 255, 0.45);
      color: var(--text-primary);
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 8px;
    }

    .sticker-card {
      margin-top: 8px;
      width: 210px;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--card-bg);
      border: 1.5px solid var(--paw-pink);
      text-align: center;
    }

    .reactions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      align-items: center;
    }

    .react-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      font-size: 12px;
      cursor: pointer;
      color: var(--text-secondary);
      font-weight: 700;
    }

    .react-pill.active {
      background: rgba(255, 126, 182, 0.22);
      border-color: var(--paw-pink);
      color: var(--paw-pink);
    }

    .msg-action-link {
      font-size: 11.5px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .msg-action-link:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.06);
    }

    /* COMPOSER & STICKER DRAWER */
    .sticker-drawer {
      background: var(--sidebar-bg);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
    }

    .sticker-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-top: 8px;
    }

    .sticker-option {
      min-width: 170px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      text-align: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .sticker-option:hover {
      border-color: var(--paw-pink);
    }

    .pack-emojis-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
    }

    .single-emoji-slot {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--sidebar-bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .single-emoji-slot:hover {
      transform: translateY(-2px) scale(1.06);
      border-color: var(--paw-pink);
      background: rgba(255, 126, 182, 0.16);
    }

    .reply-banner {
      background: var(--card-bg);
      border-top: 1px solid rgba(255, 126, 182, 0.4);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
    }

    .composer-bar {
      padding: 10px 14px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .composer-input {
      flex: 1;
      background: var(--input-bg);
      border: 1.5px solid transparent;
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
    }

    .composer-input:focus {
      border-color: var(--paw-pink);
    }

    .btn-primary {
      background: var(--paw-pink);
      color: #14121D;
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-gold {
      background: var(--gold);
      color: #14121D;
      border: none;
      border-radius: 12px;
      padding: 10px 15px;
      font-weight: 800;
      font-size: 12.5px;
      cursor: pointer;
    }

    .btn-outline {
      background: var(--card-bg);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-outline:hover {
      border-color: var(--paw-pink);
      background: var(--card-hover);
    }

    .btn-square {
      background: var(--input-bg);
      border: none;
      border-radius: 12px;
      width: 42px;
      height: 42px;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-primary);
    }

    /* 4. MEMBER SIDEBAR */
    .member-sidebar {
      width: 262px;
      background: var(--sidebar-bg);
      border-inline-start: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .member-tile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 3px;
    }

    .member-tile:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    /* QUESTS & SHOP GRID */
    .quest-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .quest-card.claimable {
      border-color: var(--gold);
      box-shadow: 0 0 16px rgba(255, 209, 102, 0.14);
    }

    .progress-track {
      height: 8px;
      background: var(--rail-bg);
      border-radius: 6px;
      overflow: hidden;
      flex: 1;
    }

    .progress-fill {
      height: 100%;
      background: var(--paw-pink);
      transition: width 0.25s ease;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .shop-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* TOAST & MODAL */
    .toast-box {
      position: fixed;
      top: 66px;
      inset-inline-end: 24px;
      background: var(--card-bg);
      border: 1.5px solid var(--gold);
      padding: 12px 18px;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      z-index: 100;
      font-weight: 700;
      font-size: 13px;
      max-width: 400px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-card {
      background: var(--sidebar-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 94%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 22px;
    }

    .lang-selector-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .lang-option-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      color: var(--text-secondary);
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
      text-align: center;
    }

    .lang-option-btn.selected {
      border-color: var(--paw-pink);
      background: rgba(255, 126, 182, 0.2);
      color: var(--text-primary);
    }

    .data-save-panel {
      background: rgba(67, 217, 173, 0.08);
      border: 1px solid rgba(67, 217, 173, 0.35);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .data-btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    @media (max-width: 940px) {
      .member-sidebar {
        display: none;
      }
      .channel-sidebar {
        width: 215px;
      }
    }

    @media (max-width: 680px) {
      .channel-sidebar {
        display: none;
      }
      .channel-sidebar.mobile-open {
        display: flex;
        position: fixed;
        inset-inline-start: 74px;
        top: 0;
        bottom: 0;
        z-index: 90;
      }
    }

    /* SIGN-IN PORTAL & ADVANCED SETTINGS & WHITEBOARD */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, #27223A 0%, #14121D 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 18px;
    }

    .auth-card {
      background: var(--sidebar-bg);
      border: 1.5px solid var(--border);
      border-radius: 22px;
      width: 100%;
      max-width: 460px;
      padding: 26px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      background: var(--rail-bg);
      padding: 5px;
      border-radius: 14px;
      margin: 16px 0;
    }

    .auth-tab {
      flex: 1;
      padding: 9px 12px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }

    .auth-tab.active {
      background: var(--paw-pink);
      color: #14121D;
    }

    .adv-preview-card {
      background: var(--rail-bg);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .phone-reward-box {
      background: rgba(255, 209, 102, 0.09);
      border: 1.5px solid rgba(255, 209, 102, 0.4);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .whiteboard-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      overflow: hidden;
    }

    .whiteboard-toolbar {
      background: var(--sidebar-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .marker-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 13px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      color: var(--text-primary);
      font-weight: 800;
      font-size: 12.5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .marker-btn.selected {
      border-color: var(--paw-pink);
      box-shadow: 0 0 12px rgba(255, 126, 182, 0.35);
      transform: translateY(-1px);
    }

    .marker-swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.4);
      display: inline-block;
    }

    .whiteboard-stage {
      flex: 1;
      background: #181523;
      border: 2px solid var(--border);
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <input type="file" id="json-restore-input" accept=".json,application/json" style="display:none" onchange="handleImportJsonFile(event)" />
  <script>
    const STORAGE_KEY = 'catmsg_saved_state_v1';
    const ACCOUNTS_KEY = 'catmsg_accounts_v2';
    const ACTIVE_USER_KEY = 'catmsg_active_username_v2';

    // --- LOCALIZATION DICTIONARY (EN / AR) ---
    const I18N = {
      en: {
        ownerTag: '👑 OWNER',
        youTag: '(You)',
        dmsAndHub: '🐾 Direct Meows & Hub',
        meowCoins: 'MeowCoins',
        questsWord: 'Quests',

    function getStoredAccounts() {
      try {
        const raw = localStorage.getItem(ACCOUNTS_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return {};
    }

    function saveStoredAccounts(accountsObj) {
      try {
        localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accountsObj));
      } catch (e) {}
    }

    function getUserStorageKey(username) {
      const clean = (username || 'captain_purr').toLowerCase().trim();
      return clean === 'captain_purr' ? STORAGE_KEY : `catmsg_user_${clean}_v2`;
    }

    function buildSerializableSnapshot() {
      return {
        version: 2,
        savedAt: new Date().toISOString(),
        lang: state.lang,
        currentUser: state.currentUser,
        users: state.users,
        servers: state.servers,
        messagesByChannel: state.messagesByChannel,
        quests: state.quests,
        whiteboardStrokes: state.whiteboardStrokes,
        visitedChannels: Array.from(state.visitedChannels)
      };
    }

    function applySnapshot(snap) {
      if (!snap || typeof snap !== 'object') return false;
      if (snap.lang) state.lang = snap.lang;
      if (snap.currentUser) {
        const isCapt = (snap.currentUser.username || '').toLowerCase() === 'captain_purr';
        state.currentUser = {
          phoneNumber: '',
          phoneRewardClaimed: false,
          unlockedMarkers: ['marker_white'],
          ...state.currentUser,
          ...snap.currentUser,
          isOwner: isCapt ? true : !!snap.currentUser.isOwner
        };
        if (!Array.isArray(state.currentUser.unlockedMarkers) || state.currentUser.unlockedMarkers.length === 0) {
          state.currentUser.unlockedMarkers = ['marker_white'];
        }
      }
      if (snap.users) state.users = snap.users;
      if (Array.isArray(snap.servers) && snap.servers.length > 0) state.servers = snap.servers;
      if (snap.messagesByChannel) state.messagesByChannel = snap.messagesByChannel;
      if (Array.isArray(snap.quests) && snap.quests.length > 0) {
        // If migrating from v1 where progress was pre-seeded (1 and 2) and nothing was claimed yet, reset to 0
        if (!snap.version) {
          const fresh = createZeroProgressQuests();
          state.quests = fresh;
        } else {
          state.quests = snap.quests;
        }
      }
      if (Array.isArray(snap.whiteboardStrokes) && snap.whiteboardStrokes.length > 0) {
        state.whiteboardStrokes = snap.whiteboardStrokes;
      }
      if (Array.isArray(snap.visitedChannels)) state.visitedChannels = new Set(snap.visitedChannels);
      document.documentElement.lang = state.lang;
      document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
      return true;
    }

    function loadSavedUserData(targetUsername = null) {
      const activeUser = (targetUsername || localStorage.getItem(ACTIVE_USER_KEY) || 'captain_purr').toLowerCase();
      const storageKey = getUserStorageKey(activeUser);
      try {
        const raw = localStorage.getItem(storageKey);
        if (raw) {
          applySnapshot(JSON.parse(raw));
        }
      } catch (e) {
        console.warn('Could not load saved user data:', e);
      }

      fetch(`/api/userdata?key=${encodeURIComponent(activeUser)}`)
        .then(r => r.json())
        .then(data => {
          if (!localStorage.getItem(storageKey) && data && data.found && data.snapshot) {
            applySnapshot(data.snapshot);
            localStorage.setItem(storageKey, JSON.stringify(data.snapshot));
            render();
          }
        })
        .catch(() => {});
    }

    function autoPersistIfEnabled() {
      try {
        const snap = buildSerializableSnapshot();
        const key = (state.currentUser.username || 'captain_purr').toLowerCase();
        const storageKey = getUserStorageKey(key);
        localStorage.setItem(storageKey, JSON.stringify(snap));
        localStorage.setItem(ACTIVE_USER_KEY, key);
        localStorage.setItem('catmsg_lang', state.lang);

        fetch(`/api/userdata?key=${encodeURIComponent(key)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(snap)
        }).catch(() => {});
      } catch (e) {
        console.warn('Auto-save failed:', e);
      }
    }

    // Hydrate saved user data on startup
    loadSavedUserData();

    // --- SIGN IN / SIGN UP / SIGN OUT FUNCTIONS ---
    function openSignInModal() {
      state.isSignedIn = false;
      state.authTab = 'signin';
      state.modal = null;
      render();

    function handleSignInSubmit() {
      const uEl = document.getElementById('auth-username');
      const pEl = document.getElementById('auth-password');
      const username = (uEl ? uEl.value : '').trim().toLowerCase().replace(/\s+/g, '_');
      const password = (pEl ? pEl.value : '').trim();
      if (!username) {
        showToast(state.lang === 'ar' ? '😾 يرجى إدخال اسم المستخدم!' : '😾 Please enter your username!');
        return;
      }
      if (username === 'captain_purr' || username === 'captainpurr' || username === 'owner') {
        quickOwnerLogin();
        return;
      }
      const accounts = getStoredAccounts();
      const acc = accounts[username];
      if (acc && acc.password && password && acc.password !== password) {
        showToast(state.lang === 'ar' ? '😾 كلمة المرور غير صحيحة!' : '😾 Incorrect password!');
        return;
      }
      if (acc && acc.snapshot) {
        applySnapshot(acc.snapshot);
      } else {
        // Sign in as existing or fresh cat profile with 0 quest progress
        state.currentUser = {
          id: 'user_' + username,
          username: username,
          displayName: acc ? acc.displayName : username,
          avatarEmoji: acc ? acc.avatarEmoji : '🐱',
          avatarColorHex: '#43D9AD',
          presence: 'Purring',
          presenceColor: '#43B581',
          customStatus: 'Meowing in CatMsg! 🐾',
          roleTitle: 'Cat Member',
          roleColor: '#43D9AD',

          phoneNumber: '',
          phoneRewardClaimed: false,
          bio: 'A friendly cat exploring The Grand Cat Castle.',
          meowCoins: 50,
          unlockedStickerIds: ['sticker_loaf', 'sticker_zoomies', 'sticker_boop', 'sticker_tuna'],
          unlockedBadges: ['🐾 Day One Paws'],
          unlockedMarkers: ['marker_white'],
          equippedBadge: '🐾 Day One Paws',
          friendIds: ['user_mochi', 'user_pounce', 'user_duchess', 'user_mittens', 'user_shadow']
        };
        state.quests = createZeroProgressQuests();
        state.visitedChannels = new Set();
        loadSavedUserData(username);
      }
      state.isSignedIn = true;
      localStorage.setItem(ACTIVE_USER_KEY, username);
      autoPersistIfEnabled();
      showToast(state.lang === 'ar' ? `🐾 تم تسجيل الدخول باسم @${username}!` : `🐾 Signed in as @${username}!`);

    function handleSignUpSubmit() {
      const uEl = document.getElementById('signup-username');
      const dEl = document.getElementById('signup-display');
      const eEl = document.getElementById('signup-emoji');
      const pEl = document.getElementById('signup-password');

      const rawUser = (uEl ? uEl.value : '').trim();
      const displayName = (dEl && dEl.value.trim()) ? dEl.value.trim() : rawUser;
      const emoji = (eEl && eEl.value.trim()) ? eEl.value.trim() : '😺';
      const password = (pEl ? pEl.value : '').trim();

      if (!rawUser) {
        showToast(state.lang === 'ar' ? '😾 اختر اسم مستخدم للقطة الجديدة!' : '😾 Please choose a username for your new cat!');
        return;
      }
      const username = rawUser.toLowerCase().replace(/\s+/g, '_');

      // Newer users always start with ALL quest progress at 0!
      state.currentUser = {
        id: 'user_' + Date.now(),
        username: username,
        displayName: displayName,
        avatarEmoji: emoji,
        avatarColorHex: '#5CE1E6',
        presence: 'Purring',
        presenceColor: '#43B581',
        customStatus: 'New kitty in the Castle! 🐾',
        roleTitle: 'Kitten',
        roleColor: '#5CE1E6',
        isOwner: false,
        phoneNumber: '',
        phoneRewardClaimed: false,
        bio: 'Brand new CatMsg member starting fresh quests from zero!',
        meowCoins: 50,
        unlockedStickerIds: ['sticker_loaf', 'sticker_zoomies', 'sticker_boop', 'sticker_tuna'],
        unlockedBadges: ['🐾 New Kitty'],
        unlockedMarkers: ['marker_white'],
        equippedBadge: '🐾 New Kitty',
        friendIds: ['user_mochi', 'user_pounce', 'user_duchess', 'user_mittens', 'user_shadow']
      };
      state.quests = createZeroProgressQuests();
      state.visitedChannels = new Set();

      const accounts = getStoredAccounts();
      accounts[username] = {
        username,
        displayName,
        avatarEmoji: emoji,
        password,
        snapshot: buildSerializableSnapshot()
      };
      saveStoredAccounts(accounts);

      state.isSignedIn = true;
      localStorage.setItem(ACTIVE_USER_KEY, username);
      autoPersistIfEnabled();
      showToast(
        state.lang === 'ar'
          ? `🎉 مرحباً @${username}! تم إنشاء حسابك وتبدأ جميع المهام من 0!`
          : `🎉 Welcome @${username}! Account created with all quest progress starting at 0!`
      );
    }

    function t() {
      return I18N[state.lang] || I18N.en;
    }

    function setLanguage(langCode) {
      state.lang = langCode === 'ar' ? 'ar' : 'en';
      localStorage.setItem('catmsg_lang', state.lang);
      document.documentElement.lang = state.lang;
      document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
      autoPersistIfEnabled();
      showToast(state.lang === 'ar' ? '🇸🇦 تم تفعيل الواجهة العربية بنجاح!' : '🇬🇧 Switched UI language to English!');
      render();
    }

    function toggleLanguageQuick() {
      setLanguage(state.lang === 'ar' ? 'en' : 'ar');
    }

    function showToast(text) {
      state.toast = text;
      render();
      setTimeout(() => {
        if (state.toast === text) {
          state.toast = null;
          render();
        }
      }, 4200);
    }

    function getCurrentServer() {
      return state.servers.find(s => s.id === state.selectedServerId) || state.servers[0];
    }

    function getCurrentChannel() {
      const srv = getCurrentServer();
      for (const cat of srv.categories) {
        for (const ch of cat.channels) {
          if (ch.id === state.selectedChannelId) return ch;
        }
      }
      return srv.categories[0].channels[0];
    }

    function getActiveChannelKey() {
      if (state.navMode === 'dms' && state.dmSubView === 'conversation') {
        return 'dm_' + state.selectedDmUserId;
      }
      return state.selectedChannelId;
    }

    function incrementQuest(actionType, delta = 1) {
      let newlyDone = null;
      for (const q of state.quests) {
        if (q.actionType === actionType && q.currentProgress < q.targetCount) {
          q.currentProgress = Math.min(q.targetCount, q.currentProgress + delta);
          if (q.currentProgress >= q.targetCount) {
            newlyDone = state.lang === 'ar' ? q.titleAr : q.title;
          }
        }
      }
      autoPersistIfEnabled();
      if (newlyDone) {
        showToast(
          state.lang === 'ar'
            ? `🎉 اكتملت المهمة: "${newlyDone}"! افتح 🪙 المهام لاستلام عملات مياو!`
            : `🎉 Quest Complete: "${newlyDone}"! Click 🪙 Quests to claim your MeowCoins!`
        );
      }
    }

    function selectServer(serverId) {
      state.navMode = 'server';
      state.selectedServerId = serverId;
      const srv = getCurrentServer();
      const firstChanId = srv.categories[0].channels[0].id;
      selectChannel(firstChanId);
    }

    function selectChannel(channelId) {
      state.navMode = 'server';
      state.selectedChannelId = channelId;
      state.mobileSidebarOpen = false;
      if (!state.visitedChannels.has(channelId)) {
        state.visitedChannels.add(channelId);
        incrementQuest('visitChannels', 1);
      }
      render();
    }

    function openDmsHome() {
      state.navMode = 'dms';
      state.dmSubView = 'friends';
      state.mobileSidebarOpen = false;
      render();
    }

    function openDmConversation(userId) {
      state.navMode = 'dms';
      state.dmSubView = 'conversation';
      state.selectedDmUserId = userId;
      state.mobileSidebarOpen = false;
      render();
    }

    function openQuests() {
      state.navMode = 'quests';
      state.mobileSidebarOpen = false;
      render();
    }

    function openWhiteboard() {
      state.navMode = 'whiteboard';
      state.mobileSidebarOpen = false;
      render();
      setTimeout(initWhiteboardCanvas, 30);
    }

    function selectOrUnlockMarker(markerId) {
      const marker = WHITEBOARD_MARKERS.find(m => m.id === markerId);
      if (!marker) return;
      if (!Array.isArray(state.currentUser.unlockedMarkers)) {
        state.currentUser.unlockedMarkers = ['marker_white'];
      }
      const owned = state.currentUser.unlockedMarkers.includes(marker.id) || marker.priceCoins === 0;
      if (owned) {
        state.activeMarkerId = marker.id;
        state.whiteboardTool = 'pen';
        render();
        setTimeout(initWhiteboardCanvas, 20);
        return;
      }
      if (state.currentUser.meowCoins < marker.priceCoins) {
        showToast(state.lang === 'ar' ? `😾 تحتاج إلى ${marker.priceCoins} عملة مياو لفتح القلم الزمردي!` : `😾 Need ${marker.priceCoins} MeowCoins to unlock ${marker.name}!`);
        return;
      }
      state.currentUser.meowCoins -= marker.priceCoins;
      state.currentUser.unlockedMarkers.push(marker.id);
      state.activeMarkerId = marker.id;
      state.whiteboardTool = 'pen';
      autoPersistIfEnabled();
      showToast(state.lang === 'ar' ? '💚 تم فتح القلم الزمردي (Emerald Marker) بنجاح!' : '💚 Unlocked Emerald Marker for 25 MeowCoins!');
      setTimeout(initWhiteboardCanvas, 20);
    }

    function sendMessage(contentText, stickerId = null, singleEmoji = null) {
      const trimmed = (contentText || '').trim();
      if (!trimmed && !stickerId && !singleEmoji) return;

      const key = getActiveChannelKey();
      if (!state.messagesByChannel[key]) state.messagesByChannel[key] = [];

      const isDm = state.navMode === 'dms' && state.dmSubView === 'conversation';
      const newMsg = {
        id: 'm_' + Date.now(),
        senderId: state.currentUser.id,
        senderName: state.currentUser.displayName,
        senderAvatar: state.currentUser.avatarEmoji,
        senderRoleColor: state.currentUser.roleColor,
        senderIsOwner: !!state.currentUser.isOwner,
        senderBadge: state.currentUser.equippedBadge,
        content: trimmed,
        stickerId: stickerId,
        singleEmoji: singleEmoji,
        replyToSenderName: state.replyingTo ? state.replyingTo.senderName : null,
        replyToPreview: state.replyingTo ? (state.replyingTo.content || '[Cat Emoji]') : null,
        reactions: {},
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        isPinned: false
      };

      state.messagesByChannel[key].push(newMsg);
      const wasReply = !!state.replyingTo;
      state.replyingTo = null;
      state.showStickerPicker = false;

      incrementQuest('sendMessages', 1);
      if (stickerId) incrementQuest('sendSticker', 1);
      if (wasReply) incrementQuest('replyMessage', 1);
      if (isDm) incrementQuest('sendDm', 1);

      autoPersistIfEnabled();

      fetch(`/api/messages?channelId=${encodeURIComponent(key)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newMsg)
      }).catch(() => {});

      render();
      scrollToBottom();

      // Playful Cat Reply
      setTimeout(() => {
        const friends = Object.values(state.users);
        const responder = isDm
          ? state.users[state.selectedDmUserId]
          : friends[Math.floor(Math.random() * friends.length)];
        if (!responder) return;

        const repliesEn = [
          `Pawsitively agreed, @${state.currentUser.displayName}! 👑🐾 Let's celebrate with extra tuna!`,
          `Mrrrow! *vibrates at 45Hz purr frequency* 😺🎶 Your orders are our command!`,
          `DID SOMEBODY SAY TUNA?! 🐟👀 I sprinted from the windowsill in 0.4 seconds!`,
          `10/10 take! Awarding you maximum purrs for the evening 🍞👑`
        ];
        const repliesAr = [
          `نتفق معك تماماً @${state.currentUser.displayName}! 👑🐾 لنحتفل بوجبة تونة فاخرة!`,
          `مياااو! *خرخرة عالية التردد* 😺🎶 أوامرك مطاعة في القلعة!`,
          `هل ذكر أحدكم التونة؟! 🐟👀 لقد ركضت من النافذة في 0.4 ثانية!`,
          `كلام حكيم 10/10! 🍞👑 لا تنسَ تفقد مهام عملات مياو!`
        ];
        const pool = state.lang === 'ar' ? repliesAr : repliesEn;

        const botMsg = {
          id: 'm_bot_' + Date.now(),
          senderId: responder.id,
          senderName: responder.displayName,
          senderAvatar: responder.avatarEmoji,
          senderRoleColor: responder.roleColor,
          senderBadge: responder.equippedBadge,
          content: pool[Math.floor(Math.random() * pool.length)],
          replyToSenderName: state.currentUser.displayName,
          replyToPreview: trimmed || '[Cat Sticker]',
          reactions: { '🐾': [responder.id] },
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          isPinned: false
        };
        state.messagesByChannel[key].push(botMsg);
        autoPersistIfEnabled();
        render();
        scrollToBottom();
      }, 1100);
    }

    function toggleReaction(msgId, emoji) {
      const key = getActiveChannelKey();
      const list = state.messagesByChannel[key] || [];
      const msg = list.find(m => m.id === msgId);
      if (!msg) return;

      if (!msg.reactions[emoji]) msg.reactions[emoji] = [];
      const idx = msg.reactions[emoji].indexOf(state.currentUser.id);
      if (idx >= 0) {
        msg.reactions[emoji].splice(idx, 1);
        if (msg.reactions[emoji].length === 0) delete msg.reactions[emoji];
      } else {
        msg.reactions[emoji].push(state.currentUser.id);
        incrementQuest('addReactions', 1);
      }
      autoPersistIfEnabled();
      render();
    }

    function togglePin(msgId) {
      const key = getActiveChannelKey();
      const list = state.messagesByChannel[key] || [];
      const msg = list.find(m => m.id === msgId);
      if (!msg) return;
      msg.isPinned = !msg.isPinned;
      autoPersistIfEnabled();
      showToast(msg.isPinned ? '📌 Pinned!' : '📌 Unpinned.');
    }

    function claimQuest(questId) {
      const q = state.quests.find(x => x.id === questId);
      if (!q || q.currentProgress < q.targetCount || q.isClaimed) return;
      q.isClaimed = true;
      state.currentUser.meowCoins += q.rewardCoins;
      autoPersistIfEnabled();
      const title = state.lang === 'ar' ? q.titleAr : q.title;
      showToast(`🪙 +${q.rewardCoins} ${t().meowCoins} (${title})!`);
    }

    function unlockOrSendSticker(stickerId, fromChat = false, chosenEmoji = null) {
      const sticker = STICKERS.find(s => s.id === stickerId);
      if (!sticker) return;
      const owned = state.currentUser.unlockedStickerIds.includes(sticker.id);
      if (owned) {
        if (fromChat) {
          sendMessage('', sticker.id, chosenEmoji || sticker.emojis[0]);
        }
        return;
      }
      if (state.currentUser.meowCoins < sticker.priceCoins) {
        showToast(state.lang === 'ar' ? `😾 تحتاج إلى ${sticker.priceCoins} عملة مياو!` : `😾 Need ${sticker.priceCoins} MeowCoins!`);
        return;
      }
      state.currentUser.meowCoins -= sticker.priceCoins;
      state.currentUser.unlockedStickerIds.push(sticker.id);
      autoPersistIfEnabled();
      showToast(`🎉 Unlocked "${state.lang === 'ar' ? sticker.nameAr : sticker.name}" (3 Emojis)!`);
    }

    function buyOrEquipBadge(badgeTitle, priceCoins) {
      const owned = state.currentUser.unlockedBadges.includes(badgeTitle);
      if (owned) {
        state.currentUser.equippedBadge = badgeTitle;
        autoPersistIfEnabled();
        showToast(`✨ ${badgeTitle}`);
        return;
      }
      if (state.currentUser.meowCoins < priceCoins) {
        showToast(state.lang === 'ar' ? `😾 تحتاج إلى ${priceCoins} عملة مياو!` : `😾 Need ${priceCoins} MeowCoins!`);
        return;
      }
      state.currentUser.meowCoins -= priceCoins;
      state.currentUser.unlockedBadges.push(badgeTitle);
      state.currentUser.equippedBadge = badgeTitle;
      autoPersistIfEnabled();
      showToast(`👑 ${badgeTitle}!`);
    }

    function cyclePresence() {
      const order = [
        { label: 'Purring', color: '#43B581' },
        { label: 'Catnapping', color: '#FAA61A' },
        { label: 'Hissing', color: '#F04747' },
        { label: 'Stray', color: '#747F8D' }
      ];
      const curIdx = order.findIndex(o => o.label === state.currentUser.presence);
      const next = order[(curIdx + 1) % order.length];
      state.currentUser.presence = next.label;
      state.currentUser.presenceColor = next.color;
      autoPersistIfEnabled();
      showToast(`🐾 ${t().presenceLabels[next.label] || next.label}`);
    }

    function scrollToBottom() {
      setTimeout(() => {
        const el = document.getElementById('messages-scroll');
        if (el) el.scrollTop = el.scrollHeight;
      }, 40);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function renderAuthPortal() {
      const L = t();
      return `
        <div class="auth-overlay">
          <div class="auth-card">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div style="font-size:32px">🏰😼</div>

    let isDrawingWhiteboard = false;
    let currentStroke = null;

    function initWhiteboardCanvas() {
      const canvas = document.getElementById('cat-whiteboard-canvas');
      const stage = document.getElementById('whiteboard-stage');
      if (!canvas || !stage) return;

      const rect = stage.getBoundingClientRect();
      canvas.width = Math.max(600, Math.floor(rect.width));
      canvas.height = Math.max(360, Math.floor(rect.height));

      redrawWhiteboardCanvas(canvas);

      canvas.onpointerdown = (e) => {
        isDrawingWhiteboard = true;
        const r = canvas.getBoundingClientRect();
        const x = e.clientX - r.left;
        const y = e.clientY - r.top;
        const markerObj = WHITEBOARD_MARKERS.find(m => m.id === state.activeMarkerId) || WHITEBOARD_MARKERS[0];
        const strokeColor = state.whiteboardTool === 'eraser' ? '#181523' : markerObj.colorHex;
        const strokeSize = state.whiteboardTool === 'eraser' ? 22 : state.whiteboardBrushSize;
        currentStroke = { color: strokeColor, size: strokeSize, points: [{ x, y }] };
        state.whiteboardStrokes.push(currentStroke);
        redrawWhiteboardCanvas(canvas);
      };

      canvas.onpointermove = (e) => {
        if (!isDrawingWhiteboard || !currentStroke) return;
        const r = canvas.getBoundingClientRect();
        const x = e.clientX - r.left;
        const y = e.clientY - r.top;
        currentStroke.points.push({ x, y });
        redrawWhiteboardCanvas(canvas);
      };

      const finishStroke = () => {
        if (isDrawingWhiteboard) {
          isDrawingWhiteboard = false;
          currentStroke = null;
          autoPersistIfEnabled();
        }
      };
      canvas.onpointerup = finishStroke;
      canvas.onpointerleave = finishStroke;
    }

    function redrawWhiteboardCanvas(canvas) {
      if (!canvas) canvas = document.getElementById('cat-whiteboard-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Subtle dot grid
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      for (let gx = 24; gx < canvas.width; gx += 28) {
        for (let gy = 24; gy < canvas.height; gy += 28) {
          ctx.fillRect(gx, gy, 2, 2);
        }
      }

      for (const st of state.whiteboardStrokes) {
        if (!st.points || st.points.length === 0) continue;
        ctx.strokeStyle = st.color || '#FFFFFF';
        ctx.lineWidth = st.size || 5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(st.points[0].x, st.points[0].y);
        for (let i = 1; i < st.points.length; i++) {
          ctx.lineTo(st.points[i].x, st.points[i].y);
        }
        if (st.points.length === 1) {
          ctx.lineTo(st.points[0].x + 0.5, st.points[0].y + 0.5);
        }
        ctx.stroke();
      }
    }

    function undoWhiteboardStroke() {
      state.whiteboardStrokes.pop();
      autoPersistIfEnabled();
      redrawWhiteboardCanvas();
    }

    function clearWhiteboard() {
      state.whiteboardStrokes = [];

    function stampCatOnWhiteboard() {

      state.whiteboardStrokes.push({

        size: state.whiteboardBrushSize,
        points: [
          { x: cx - 45, y: cy - 10 }, { x: cx - 32, y: cy - 48 }, { x: cx - 14, y: cy - 22 },
          { x: cx + 14, y: cy - 22 }, { x: cx + 32, y: cy - 48 }, { x: cx + 45, y: cy - 10 },
          { x: cx + 48, y: cy + 32 }, { x: cx, y: cy + 50 }, { x: cx - 48, y: cy + 32 }, { x: cx - 45, y: cy - 10 }
        ]
      });
      autoPersistIfEnabled();
      redrawWhiteboardCanvas();
    }

    function updateLiveProfilePreview() {
      const nEl = document.getElementById('prof-name');
      const eEl = document.getElementById('prof-emoji');
      const sEl = document.getElementById('prof-status');
      const prevName = document.getElementById('preview-disp-name');
      const prevEmoji = document.getElementById('preview-avatar-emoji');
      const prevStatus = document.getElementById('preview-custom-status');
      if (prevName && nEl) prevName.textContent = nEl.value || state.currentUser.displayName;
      if (prevEmoji && eEl) prevEmoji.textContent = eEl.value || state.currentUser.avatarEmoji;
      if (prevStatus && sEl) prevStatus.textContent = sEl.value || state.currentUser.customStatus;
    }

    function linkPhoneNumberForReward() {
      const pEl = document.getElementById('prof-phone');
      const rawPhone = (pEl ? pEl.value : '').trim();
      if (!rawPhone || rawPhone.length < 5) {
        showToast(state.lang === 'ar' ? '😾 يرجى إدخال رقم هاتف صحيح!' : '😾 Please enter a valid phone number!');
        return;
      }
      state.currentUser.phoneNumber = rawPhone;
      if (!state.currentUser.phoneRewardClaimed) {
        state.currentUser.phoneRewardClaimed = true;
        state.currentUser.meowCoins += 50;
        autoPersistIfEnabled();
        showToast(
          state.lang === 'ar'
            ? '📱🪙 تم ربط رقم الهاتف وحصلت على +50 عملة مياو!'
            : '📱🪙 Phone number added! +50 MeowCoins credited to your account!'
        );
      } else {
        autoPersistIfEnabled();
        showToast(state.lang === 'ar' ? '📱 تم تحديث رقم الهاتف!' : '📱 Phone number updated!');
      }
    }

              <div style="display:grid;grid-template-columns:1fr 90px;gap:10px;margin-bottom:10px">
                <div>
                  <div style="font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:4px">${L.displayNameLabel}</div>
                  <input id="prof-name" class="composer-input" style="width:100%" value="${escapeHtml(state.currentUser.displayName)}" oninput="updateLiveProfilePreview()" />
                </div>
                <div>
                  <div style="font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:4px">${L.avatarEmojiLabel}</div>
                  <input id="prof-emoji" class="composer-input" style="width:100%;text-align:center" value="${escapeHtml(state.currentUser.avatarEmoji)}" oninput="updateLiveProfilePreview()" />
                </div>
              </div>

              <div style="font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:4px">${L.customStatusLabel}</div>
              <input id="prof-status" class="composer-input" style="width:100%;margin-bottom:14px" value="${escapeHtml(state.currentUser.customStatus)}" oninput="updateLiveProfilePreview()" />

              <!-- ADVANCED SETTINGS: ONLY PROFILE PREVIEW & OPTIONAL PHONE NUMBER (+50 MEOWCOINS) -->
              <div style="font-weight:900;font-size:12px;color:var(--paw-pink);letter-spacing:0.8px;margin-bottom:8px">
                ${L.advancedSettingsHeader}
              </div>

              <div style="font-size:11.5px;font-weight:800;color:var(--text-secondary);margin-bottom:6px">${L.profilePreviewLabel}</div>
              <div class="adv-preview-card">
                <div style="height:48px;background:linear-gradient(135deg, ${state.currentUser.avatarColorHex || '#FF7EB6'}, var(--purrple))"></div>
                <div style="padding:0 14px 14px">
                  <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:-22px">
                    <div class="avatar-wrap" style="width:48px;height:48px;font-size:25px;border:3px solid var(--rail-bg);background:var(--card-bg)">
                      <span id="preview-avatar-emoji">${escapeHtml(state.currentUser.avatarEmoji)}</span>
                      <div class="status-dot" style="background:${state.currentUser.presenceColor}"></div>
                    </div>
                    <div style="display:flex;gap:6px;flex-wrap:wrap">
                      ${state.currentUser.isOwner ? `<span class="owner-tag">${L.ownerTag}</span>` : ''}
                      ${state.currentUser.equippedBadge ? `<span class="badge-tag">${escapeHtml(state.currentUser.equippedBadge)}</span>` : ''}
                    </div>
                  </div>
                  <div style="margin-top:8px;font-weight:900;font-size:15px;color:var(--gold)" id="preview-disp-name">${escapeHtml(state.currentUser.displayName)}</div>
                  <div style="font-size:11.5px;color:var(--text-muted)">@${escapeHtml(state.currentUser.username)} ${state.currentUser.phoneNumber ? `• 📱 ${escapeHtml(state.currentUser.phoneNumber)}` : ''}</div>
                  <div style="margin-top:6px;font-size:12.5px;color:var(--text-secondary)" id="preview-custom-status">${escapeHtml(state.currentUser.customStatus)}</div>
                </div>
              </div>

              <div class="phone-reward-box">
                <div style="font-size:12px;font-weight:800;color:var(--gold);margin-bottom:4px">${L.phoneOptionalLabel}</div>
                <div style="font-size:11.5px;color:var(--text-secondary);margin-bottom:8px">
                  ${state.currentUser.phoneRewardClaimed
                    ? L.phoneClaimedNotice(escapeHtml(state.currentUser.phoneNumber))
                    : L.phoneUnclaimedNotice}
                </div>
                <div style="display:flex;gap:8px">
                  <input id="prof-phone" class="composer-input" style="padding:9px 12px" placeholder="${L.phonePlaceholder}" value="${escapeHtml(state.currentUser.phoneNumber || '')}" />
                  <button class="btn-gold" onclick="linkPhoneNumberForReward()">
                    ${state.currentUser.phoneRewardClaimed ? '📱 Update' : L.linkPhoneBtn}
                  </button>
                </div>
              </div>

              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px">
                <button class="btn-outline" onclick="openSignInModal()">${L.signOutBtn}</button>
                <div style="display:flex;gap:8px">
                  <button class="icon-btn" onclick="state.modal=null;render()">${L.cancelBtn}</button>
                  <button class="btn-primary" onclick="saveProfile()">${L.saveBtn}</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }
      if (state.modal === 'pinned') {
        const key = getActiveChannelKey();
        const pinned = (state.messagesByChannel[key] || []).filter(m => m.isPinned);
        return `
          <div class="modal-backdrop" onclick="if(event.target===this){state.modal=null;render()}">
            <div class="modal-card">
              <div style="font-weight:800;font-size:18px;margin-bottom:14px">${L.pinnedModalTitle}</div>
              ${pinned.length === 0
                ? `<div style="color:var(--text-secondary);font-size:13.5px;margin-bottom:16px">${L.noPinnedMessages}</div>`
                : pinned.map(p => `
                    <div style="background:var(--card-bg);padding:12px;border-radius:12px;margin-bottom:10px">
                      <div style="font-weight:800;color:var(--paw-pink);font-size:13px">${p.senderAvatar} ${escapeHtml(p.senderName)}</div>
                      <div style="font-size:13px;margin-top:4px">${escapeHtml(p.content)}</div>
                    </div>
                  `).join('')}
              <div style="display:flex;justify-content:flex-end">
                <button class="btn-primary" onclick="state.modal=null;render()">${L.closeBtn}</button>
              </div>
            </div>
          </div>
        `;
      }
      return '';
    }

    function createNewServer() {
      const name = document.getElementById('srv-name').value.trim();
      const emoji = document.getElementById('srv-emoji').value.trim() || '🐟';
      if (!name) return;
      const id = 'srv_' + Date.now();
      const chanId = 'chan_' + Date.now();
      state.servers.push({
        id,
        name,
        iconEmoji: emoji,
        categories: [
          {
            id: 'cat_' + Date.now(),
            name: '💬 MEOW CHATS',
            channels: [
              { id: chanId, name: 'general-meows', prefix: '🐾', topic: `Welcome to ${name}!` }
            ]
          }
        ]
      });
      state.messagesByChannel[chanId] = [
        {
          id: 'm_' + Date.now(),
          senderId: state.currentUser.id,
          senderName: state.currentUser.displayName,
          senderAvatar: state.currentUser.avatarEmoji,
          senderRoleColor: state.currentUser.roleColor,
          senderIsOwner: !!state.currentUser.isOwner,
          senderBadge: state.currentUser.equippedBadge,
          content: `Welcome everykitty to ${name} ${emoji}! Grab a cardboard box and make yourselves at home! 🐾✨`,
          reactions: { '🐾': [state.currentUser.id] },
          time: 'Just now',
          isPinned: true
        }
      ];
      state.modal = null;
      autoPersistIfEnabled();
      selectServer(id);
      showToast(`🏰 "${name}"!`);
    }

    function createNewChannel() {
      const name = document.getElementById('chan-name').value.trim().toLowerCase().replace(/\s+/g, '-');
      const topic = document.getElementById('chan-topic').value.trim() || 'Cozy cat discussions';
      if (!name) return;
      const srv = getCurrentServer();
      const chanId = 'chan_' + Date.now();
      srv.categories[0].channels.push({
        id: chanId,
        name,
        prefix: '🐾',
        topic
      });
      state.modal = null;
      autoPersistIfEnabled();
      selectChannel(chanId);
      showToast(`🐾 #${name}!`);
    }

    function saveProfile() {
      const name = document.getElementById('prof-name').value.trim();
      const emoji = document.getElementById('prof-emoji').value.trim();
      const status = document.getElementById('prof-status').value.trim();
      const phoneEl = document.getElementById('prof-phone');
      const phone = phoneEl ? phoneEl.value.trim() : '';

      if (name) state.currentUser.displayName = name;
      if (emoji) state.currentUser.avatarEmoji = emoji;
      if (status) state.currentUser.customStatus = status;

      let phoneBonusMsg = '';
      if (phone && phone.length >= 5) {
        state.currentUser.phoneNumber = phone;
        if (!state.currentUser.phoneRewardClaimed) {
          state.currentUser.phoneRewardClaimed = true;
          state.currentUser.meowCoins += 50;
          phoneBonusMsg = state.lang === 'ar' ? ' (+50 🪙 مكافأة رقم الهاتف!)' : ' (+50 🪙 Phone Bonus!)';
        }
      }

      state.modal = null;
      autoPersistIfEnabled();
      showToast((state.lang === 'ar' ? '🐾 تم تحديث إعدادات حساب القطة!' : '🐾 Cat Profile & Settings updated!') + phoneBonusMsg);
    }

    render();
  </script>
</body>
</html>
