<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CatMsg (PurrCord) — Cat-Themed Discord Messaging</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#14121D" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>😼</text></svg>" />
  <style>
    :root {
      --rail-bg: #14121D;
      --sidebar-bg: #1D1A2B;
      --pod-bg: #171422;
      --feed-bg: #252136;
      --input-bg: #322C47;
      --card-bg: #2D2841;
      --card-hover: #393252;
      --paw-pink: #FF7EB6;
      --purrple: #9D7BFF;
      --gold: #FFD166;
      --mint: #43D9AD;
      --coral: #FF6B6B;
      --yarn-blue: #5CE1E6;
      --text-primary: #F4F1FA;
      --text-secondary: #B5AFC7;
      --text-muted: #7C7594;
      --border: rgba(255, 255, 255, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--feed-bg);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .app-shell {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* 1. SERVER RAIL */
    .server-rail {
      width: 74px;
      background: var(--rail-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 10px;
      flex-shrink: 0;
      z-index: 30;
    }

    .rail-divider {
      width: 34px;
      height: 2px;
      background: var(--border);
      margin: 2px 0;
    }

    .rail-btn-wrap {
      position: relative;
      width: 74px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .rail-pill {
      position: absolute;
      inset-inline-start: 0;
      width: 4px;
      height: 0;
      background: var(--paw-pink);
      border-radius: 4px;
      transition: all 0.18s ease;
    }

    .rail-btn-wrap:hover .rail-pill {
      height: 20px;
    }

    .rail-btn-wrap.active .rail-pill {
      height: 38px;
    }

    .rail-btn {
      width: 48px;
      height: 48px;
      border-radius: 24px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      cursor: pointer;
      transition: all 0.18s ease;
      position: relative;
    }

    .rail-btn:hover,
    .rail-btn-wrap.active .rail-btn {
      border-radius: 16px;
      background: rgba(255, 126, 182, 0.22);
      border-color: var(--paw-pink);
    }

    .rail-badge {
      position: absolute;
      top: -4px;
      inset-inline-end: -4px;
      background: var(--coral);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 10px;
      border: 2px solid var(--rail-bg);
    }

    /* 2. CHANNEL / DM SIDEBAR */
    .channel-sidebar {
      width: 254px;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      border-inline-end: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-header {
      height: 54px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      font-weight: 800;
      font-size: 15px;
      background: linear-gradient(135deg, rgba(255, 126, 182, 0.16), transparent);
    }

    .quest-mini-banner {
      margin: 10px 10px 4px;
      padding: 10px 12px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(255, 209, 102, 0.18), rgba(157, 123, 255, 0.18));
      border: 1px solid rgba(255, 209, 102, 0.45);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .quest-mini-banner:hover {
      transform: translateY(-1px);
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .cat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 6px 4px;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .chan-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 2px;
      transition: background 0.15s;
    }

    .chan-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
    }

    .chan-item.active {
      background: rgba(255, 126, 182, 0.18);
      color: var(--text-primary);
      font-weight: 700;
    }

    .user-pod {
      padding: 10px;
      background: var(--pod-bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-wrap {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 126, 182, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .status-dot {
      position: absolute;
      inset-inline-end: -1px;
      bottom: -1px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--pod-bg);
    }

    /* OWNER TAG */
    .owner-tag {
      background: linear-gradient(135deg, #FFD166, #FF9F1C);
      color: #14121D;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      box-shadow: 0 0 10px rgba(255, 209, 102, 0.45);
      display: inline-flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    /* 3. CENTER MAIN VIEW */
    .main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--feed-bg);
      min-width: 0;
    }

    .top-bar {
      height: 54px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .topic-text {
      color: var(--text-muted);
      font-size: 12.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      border-inline-start: 1px solid var(--border);
      padding-inline-start: 12px;
      margin-inline-start: 4px;
    }

    .coin-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 209, 102, 0.16);
      border: 1px solid rgba(255, 209, 102, 0.45);
      color: var(--gold);
      padding: 5px 11px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 12.5px;
      cursor: pointer;
    }

    .save-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(67, 217, 173, 0.15);
      border: 1px solid rgba(67, 217, 173, 0.45);
      color: var(--mint);
      padding: 5px 10px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }

    .save-pill:hover {
      background: rgba(67, 217, 173, 0.26);
    }

    .lang-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(157, 123, 255, 0.16);
      border: 1px solid rgba(157, 123, 255, 0.45);
      color: var(--text-primary);
      padding: 5px 10px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .lang-pill:hover {
      background: rgba(157, 123, 255, 0.28);
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 17px;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
    }

    .messages-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      user-select: text;
    }

    .welcome-card {
      padding: 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255, 126, 182, 0.12), rgba(157, 123, 255, 0.08));
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .msg-item {
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
      transition: background 0.12s;
    }

    .msg-item:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .msg-item.pinned {
      border: 1px solid rgba(255, 209, 102, 0.35);
    }

    .reply-line {
      font-size: 12px;
      color: var(--text-muted);
      margin-inline-start: 16px;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .msg-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .badge-tag {
      background: rgba(157, 123, 255, 0.2);
      border: 1px solid rgba(157, 123, 255, 0.45);
      color: var(--text-primary);
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 8px;
    }

    .sticker-card {
      margin-top: 8px;
      width: 210px;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--card-bg);
      border: 1.5px solid var(--paw-pink);
      text-align: center;
    }

    .reactions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      align-items: center;
    }

    .react-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      font-size: 12px;
      cursor: pointer;
      color: var(--text-secondary);
      font-weight: 700;
    }

    .react-pill.active {
      background: rgba(255, 126, 182, 0.22);
      border-color: var(--paw-pink);
      color: var(--paw-pink);
    }

    .msg-action-link {
      font-size: 11.5px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .msg-action-link:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.06);
    }

    /* COMPOSER & STICKER DRAWER */
    .sticker-drawer {
      background: var(--sidebar-bg);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
    }

    .sticker-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-top: 8px;
    }

    .sticker-option {
      min-width: 132px;
      padding: 10px;
      border-radius: 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      text-align: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .sticker-option:hover {
      border-color: var(--paw-pink);
    }

    .reply-banner {
      background: var(--card-bg);
      border-top: 1px solid rgba(255, 126, 182, 0.4);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
    }

    .composer-bar {
      padding: 10px 14px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .composer-input {
      flex: 1;
      background: var(--input-bg);
      border: 1.5px solid transparent;
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
    }

    .composer-input:focus {
      border-color: var(--paw-pink);
    }

    .btn-primary {
      background: var(--paw-pink);
      color: #14121D;
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-gold {
      background: var(--gold);
      color: #14121D;
      border: none;
      border-radius: 12px;
      padding: 10px 15px;
      font-weight: 800;
      font-size: 12.5px;
      cursor: pointer;
    }

    .btn-outline {
      background: var(--card-bg);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-outline:hover {
      border-color: var(--paw-pink);
      background: var(--card-hover);
    }

    .btn-square {
      background: var(--input-bg);
      border: none;
      border-radius: 12px;
      width: 42px;
      height: 42px;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-primary);
    }

    /* 4. MEMBER SIDEBAR */
    .member-sidebar {
      width: 262px;
      background: var(--sidebar-bg);
      border-inline-start: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .member-tile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 3px;
    }

    .member-tile:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    /* QUESTS & SHOP GRID */
    .quest-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .quest-card.claimable {
      border-color: var(--gold);
      box-shadow: 0 0 16px rgba(255, 209, 102, 0.14);
    }

    .progress-track {
      height: 8px;
      background: var(--rail-bg);
      border-radius: 6px;
      overflow: hidden;
      flex: 1;
    }

    .progress-fill {
      height: 100%;
      background: var(--paw-pink);
      transition: width 0.25s ease;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .shop-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* TOAST & MODAL */
    .toast-box {
      position: fixed;
      top: 66px;
      inset-inline-end: 24px;
      background: var(--card-bg);
      border: 1.5px solid var(--gold);
      padding: 12px 18px;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      z-index: 100;
      font-weight: 700;
      font-size: 13px;
      max-width: 400px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-card {
      background: var(--sidebar-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 94%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 22px;
    }

    .lang-selector-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .lang-option-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      color: var(--text-secondary);
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
      text-align: center;
    }

    .lang-option-btn.selected {
      border-color: var(--paw-pink);
      background: rgba(255, 126, 182, 0.2);
      color: var(--text-primary);
    }

    .data-save-panel {
      background: rgba(67, 217, 173, 0.08);
      border: 1px solid rgba(67, 217, 173, 0.35);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .data-btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    @media (max-width: 940px) {
      .member-sidebar {
        display: none;
      }
      .channel-sidebar {
        width: 215px;
      }
    }

    @media (max-width: 680px) {
      .channel-sidebar {
        display: none;
      }
      .channel-sidebar.mobile-open {
        display: flex;
        position: fixed;
        inset-inline-start: 74px;
        top: 0;
        bottom: 0;
        z-index: 90;
      }
    }
  </style>
</head>

    // --- USER DATA SAVING & RESTORING ENGINE ---
    function buildSerializableSnapshot() {
      return {
        version: 1,
        savedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        lang: state.lang,
        autoSaveEnabled: state.autoSaveEnabled,
        currentUser: state.currentUser,
        users: state.users,
        servers: state.servers,
        messagesByChannel: state.messagesByChannel,
        quests: state.quests,
        visitedChannels: Array.from(state.visitedChannels)
      };
    }

    function applySnapshot(snap) {
      if (!snap || typeof snap !== 'object') return false;
      if (snap.lang) state.lang = snap.lang;
      if (typeof snap.autoSaveEnabled === 'boolean') state.autoSaveEnabled = snap.autoSaveEnabled;
      if (snap.currentUser) state.currentUser = { ...state.currentUser, ...snap.currentUser, isOwner: true };
      if (snap.users) state.users = snap.users;
      if (Array.isArray(snap.servers) && snap.servers.length > 0) state.servers = snap.servers;
      if (snap.messagesByChannel) state.messagesByChannel = snap.messagesByChannel;
      if (Array.isArray(snap.quests) && snap.quests.length > 0) state.quests = snap.quests;
      if (Array.isArray(snap.visitedChannels)) state.visitedChannels = new Set(snap.visitedChannels);
      if (snap.savedAt) state.lastSavedAt = snap.savedAt;
      document.documentElement.lang = state.lang;
      document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
      return true;
    }

    function loadSavedUserData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        applySnapshot(parsed);
      } catch (e) {
        console.warn('Could not load saved user data:', e);
      }
    }

    function saveUserDataNow(showNotification = false) {
      try {
        const snap = buildSerializableSnapshot();
        state.lastSavedAt = snap.savedAt;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(snap));
        localStorage.setItem('catmsg_lang', state.lang);

        // Also sync to Cloudflare Edge API
        const key = (state.currentUser.username || 'captain_purr').toLowerCase();
        fetch(`/api/userdata?key=${encodeURIComponent(key)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(snap)
        }).catch(() => {});

        if (showNotification) {
          showToast(
            state.lang === 'ar'
              ? `💾 تم حفظ جميع بياناتك محلياً وفي السحابة (${state.lastSavedAt})!`
              : `💾 User data saved to Browser & Cloud (${state.lastSavedAt})!`
          );
        }
        render();
      } catch (e) {
        console.warn('Save failed:', e);
      }
    }

    function autoPersistIfEnabled() {
      if (state.autoSaveEnabled) {
        saveUserDataNow(false);
      }
    }

    function toggleAutoSave() {
      state.autoSaveEnabled = !state.autoSaveEnabled;
      saveUserDataNow(false);
      showToast(
        state.lang === 'ar'
          ? (state.autoSaveEnabled ? '💾 تم تفعيل الحفظ التلقائي للبيانات!' : '⏸️ تم إيقاف الحفظ التلقائي.')
          : (state.autoSaveEnabled ? '💾 Auto-Save enabled!' : '⏸️ Auto-Save paused.')
      );
    }

    async function restoreFromCloudSave() {
      const key = (state.currentUser.username || 'captain_purr').toLowerCase();
      try {
        const res = await fetch(`/api/userdata?key=${encodeURIComponent(key)}`);
        const data = await res.json();
        if (data && data.found && data.snapshot) {
          applySnapshot(data.snapshot);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data.snapshot));
          showToast(
            state.lang === 'ar'
              ? '☁️ تمت استعادة بياناتك من السحابة بنجاح!'
              : '☁️ Restored user data from Cloud Save!'
          );
          render();
        } else {
          showToast(
            state.lang === 'ar'
              ? 'ℹ️ لا توجد نسخة سحابية محفوظة بعد — اضغط "حفظ البيانات الآن" أولاً!'
              : 'ℹ️ No cloud snapshot found yet — click "Save Data Now" first!'
          );
        }
      } catch (_) {
        showToast('⚠️ Cloud restore unavailable offline.');
      }
    }

    function exportUserDataJson() {
      const snap = buildSerializableSnapshot();
      const blob = new Blob([JSON.stringify(snap, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `catmsg-backup-${state.currentUser.username || 'owner'}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(
        state.lang === 'ar'
          ? '📥 تم تنزيل ملف النسخة الاحتياطية (.json) بنجاح!'
          : '📥 Exported User Data Backup (.json)!'
      );
    }

    function triggerImportJsonFile() {
      const input = document.getElementById('json-restore-input');
      if (input) {
        input.value = '';
        input.click();
      }
    }

    function handleImportJsonFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (applySnapshot(parsed)) {
            saveUserDataNow(false);
            showToast(
              state.lang === 'ar'
                ? '📤 تمت استعادة جميع بياناتك من ملف النسخة الاحتياطية!'
                : '📤 User data restored from JSON backup file!'
            );
            render();
          }
        } catch (_) {
          showToast('😾 Invalid JSON backup file.');
        }
      };
      reader.readAsText(file);
    }

    function resetUserDataToDefault() {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }

    // Hydrate saved user data on startup
    loadSavedUserData();

    function t() {
      return I18N[state.lang] || I18N.en;
    }

    function setLanguage(langCode) {
      state.lang = langCode === 'ar' ? 'ar' : 'en';
      localStorage.setItem('catmsg_lang', state.lang);
      document.documentElement.lang = state.lang;
      document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
      autoPersistIfEnabled();
      showToast(state.lang === 'ar' ? '🇸🇦 تم تفعيل الواجهة العربية بنجاح!' : '🇬🇧 Switched UI language to English!');
      render();
    }

    function toggleLanguageQuick() {
      setLanguage(state.lang === 'ar' ? 'en' : 'ar');
    }

    function showToast(text) {
      state.toast = text;
      render();
      setTimeout(() => {
        if (state.toast === text) {
          state.toast = null;
          render();
        }
      }, 4200);
    }

    function getCurrentServer() {
      return state.servers.find(s => s.id === state.selectedServerId) || state.servers[0];
    }

    function getCurrentChannel() {
      const srv = getCurrentServer();
      for (const cat of srv.categories) {
        for (const ch of cat.channels) {
          if (ch.id === state.selectedChannelId) return ch;
        }
      }
      return srv.categories[0].channels[0];
    }

    function getActiveChannelKey() {
      if (state.navMode === 'dms' && state.dmSubView === 'conversation') {
        return 'dm_' + state.selectedDmUserId;
      }
      return state.selectedChannelId;
    }

    function incrementQuest(actionType, delta = 1) {
      let newlyDone = null;
      for (const q of state.quests) {
        if (q.actionType === actionType && q.currentProgress < q.targetCount) {
          q.currentProgress = Math.min(q.targetCount, q.currentProgress + delta);
          if (q.currentProgress >= q.targetCount) {
            newlyDone = state.lang === 'ar' ? q.titleAr : q.title;
          }
        }
      }
      autoPersistIfEnabled();
      if (newlyDone) {
        showToast(
          state.lang === 'ar'
            ? `🎉 اكتملت المهمة: "${newlyDone}"! افتح 🪙 المهام لاستلام عملات مياو!`
            : `🎉 Quest Complete: "${newlyDone}"! Click 🪙 Quests to claim your MeowCoins!`
        );
      }
    }

    function selectServer(serverId) {
      state.navMode = 'server';
      state.selectedServerId = serverId;
      const srv = getCurrentServer();
      const firstChanId = srv.categories[0].channels[0].id;
      selectChannel(firstChanId);
    }

    function selectChannel(channelId) {
      state.navMode = 'server';
      state.selectedChannelId = channelId;
      state.mobileSidebarOpen = false;
      if (!state.visitedChannels.has(channelId)) {
        state.visitedChannels.add(channelId);
        incrementQuest('visitChannels', 1);
      }
      render();
    }

    function openDmsHome() {
      state.navMode = 'dms';
      state.dmSubView = 'friends';
      state.mobileSidebarOpen = false;
      render();
    }

    function openDmConversation(userId) {
      state.navMode = 'dms';
      state.dmSubView = 'conversation';
      state.selectedDmUserId = userId;
      state.mobileSidebarOpen = false;
      render();
    }

    function openQuests() {
      state.navMode = 'quests';
      state.mobileSidebarOpen = false;
      render();
    }

    function sendMessage(contentText, stickerId = null) {
      const trimmed = (contentText || '').trim();
      if (!trimmed && !stickerId) return;

      const key = getActiveChannelKey();
      if (!state.messagesByChannel[key]) state.messagesByChannel[key] = [];

      const isDm = state.navMode === 'dms' && state.dmSubView === 'conversation';
      const newMsg = {
        id: 'm_' + Date.now(),
        senderId: state.currentUser.id,
        senderName: state.currentUser.displayName,
        senderAvatar: state.currentUser.avatarEmoji,
        senderRoleColor: state.currentUser.roleColor,
        senderIsOwner: true,
        senderBadge: state.currentUser.equippedBadge,
        content: trimmed,
        stickerId: stickerId,
        replyToSenderName: state.replyingTo ? state.replyingTo.senderName : null,
        replyToPreview: state.replyingTo ? (state.replyingTo.content || '[Cat Sticker]') : null,
        reactions: {},
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        isPinned: false
      };

      state.messagesByChannel[key].push(newMsg);
      const wasReply = !!state.replyingTo;
      state.replyingTo = null;
      state.showStickerPicker = false;

      incrementQuest('sendMessages', 1);
      if (stickerId) incrementQuest('sendSticker', 1);
      if (wasReply) incrementQuest('replyMessage', 1);
      if (isDm) incrementQuest('sendDm', 1);

      autoPersistIfEnabled();

      fetch(`/api/messages?channelId=${encodeURIComponent(key)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newMsg)
      }).catch(() => {});

      render();
      scrollToBottom();

      // Playful Cat Reply
      setTimeout(() => {
        const friends = Object.values(state.users);
        const responder = isDm
          ? state.users[state.selectedDmUserId]
          : friends[Math.floor(Math.random() * friends.length)];
        if (!responder) return;

        const repliesEn = [
          `Pawsitively agreed, Owner @${state.currentUser.displayName}! 👑🐾 Let's celebrate with extra tuna!`,
          `Mrrrow! *vibrates at 45Hz purr frequency* 😺🎶 Your Royal Owner orders are our command!`,
          `DID SOMEBODY SAY TUNA?! 🐟👀 I sprinted from the windowsill in 0.4 seconds!`,
          `10/10 take, Boss! Awarding you maximum purrs for the evening 🍞👑`
        ];
        const repliesAr = [
          `نتفق معك تماماً أيها المالك @${state.currentUser.displayName}! 👑🐾 لنحتفل بوجبة تونة فاخرة!`,
          `مياااو! *خرخرة عالية التردد* 😺🎶 أوامرك الملكية مطاعة في القلعة!`,
          `هل ذكر أحدكم التونة؟! 🐟👀 لقد ركضت من النافذة في 0.4 ثانية!`,
          `كلام حكيم 10/10 أيها القائد! 🍞👑 لا تنسَ تفقد مهام عملات مياو!`
        ];
        const pool = state.lang === 'ar' ? repliesAr : repliesEn;

        const botMsg = {
          id: 'm_bot_' + Date.now(),
          senderId: responder.id,
          senderName: responder.displayName,
          senderAvatar: responder.avatarEmoji,
          senderRoleColor: responder.roleColor,
          senderBadge: responder.equippedBadge,
          content: pool[Math.floor(Math.random() * pool.length)],
          replyToSenderName: state.currentUser.displayName,
          replyToPreview: trimmed || '[Cat Sticker]',
          reactions: { '🐾': [responder.id] },
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          isPinned: false
        };
        state.messagesByChannel[key].push(botMsg);
        autoPersistIfEnabled();
        render();
        scrollToBottom();
      }, 1100);
    }

    function toggleReaction(msgId, emoji) {
      const key = getActiveChannelKey();
      const list = state.messagesByChannel[key] || [];
      const msg = list.find(m => m.id === msgId);
      if (!msg) return;

      if (!msg.reactions[emoji]) msg.reactions[emoji] = [];
      const idx = msg.reactions[emoji].indexOf(state.currentUser.id);
      if (idx >= 0) {
        msg.reactions[emoji].splice(idx, 1);
        if (msg.reactions[emoji].length === 0) delete msg.reactions[emoji];
      } else {
        msg.reactions[emoji].push(state.currentUser.id);
        incrementQuest('addReactions', 1);
      }
      autoPersistIfEnabled();
      render();
    }

    function togglePin(msgId) {
      const key = getActiveChannelKey();
      const list = state.messagesByChannel[key] || [];
      const msg = list.find(m => m.id === msgId);
      if (!msg) return;
      msg.isPinned = !msg.isPinned;
      autoPersistIfEnabled();
      showToast(msg.isPinned ? '📌 Pinned!' : '📌 Unpinned.');
    }

    function claimQuest(questId) {
      const q = state.quests.find(x => x.id === questId);
      if (!q || q.currentProgress < q.targetCount || q.isClaimed) return;
      q.isClaimed = true;
      state.currentUser.meowCoins += q.rewardCoins;
      autoPersistIfEnabled();
      const title = state.lang === 'ar' ? q.titleAr : q.title;
      showToast(`🪙 +${q.rewardCoins} ${t().meowCoins} (${title})!`);
    }

    function unlockOrSendSticker(stickerId, fromChat = false) {
      const sticker = STICKERS.find(s => s.id === stickerId);
      if (!sticker) return;
      const owned = state.currentUser.unlockedStickerIds.includes(sticker.id);
      if (owned) {
        if (fromChat) sendMessage('', sticker.id);
        return;
      }
      if (state.currentUser.meowCoins < sticker.priceCoins) {
        showToast(state.lang === 'ar' ? `😾 تحتاج إلى ${sticker.priceCoins} عملة مياو!` : `😾 Need ${sticker.priceCoins} MeowCoins!`);
        return;
      }
      state.currentUser.meowCoins -= sticker.priceCoins;
      state.currentUser.unlockedStickerIds.push(sticker.id);
      autoPersistIfEnabled();
      showToast(`🎉 Unlocked "${state.lang === 'ar' ? sticker.nameAr : sticker.name}"!`);
    }

    function buyOrEquipBadge(badgeTitle, priceCoins) {
      const owned = state.currentUser.unlockedBadges.includes(badgeTitle);
      if (owned) {
        state.currentUser.equippedBadge = badgeTitle;
        autoPersistIfEnabled();
        showToast(`✨ ${badgeTitle}`);
        return;
      }
      if (state.currentUser.meowCoins < priceCoins) {
        showToast(state.lang === 'ar' ? `😾 تحتاج إلى ${priceCoins} عملة مياو!` : `😾 Need ${priceCoins} MeowCoins!`);
        return;
      }
      state.currentUser.meowCoins -= priceCoins;
      state.currentUser.unlockedBadges.push(badgeTitle);
      state.currentUser.equippedBadge = badgeTitle;
      autoPersistIfEnabled();
      showToast(`👑 ${badgeTitle}!`);
    }

    function cyclePresence() {
      const order = [
        { label: 'Purring', color: '#43B581' },
        { label: 'Catnapping', color: '#FAA61A' },
        { label: 'Hissing', color: '#F04747' },
        { label: 'Stray', color: '#747F8D' }
      ];
      const curIdx = order.findIndex(o => o.label === state.currentUser.presence);
      const next = order[(curIdx + 1) % order.length];
      state.currentUser.presence = next.label;
      state.currentUser.presenceColor = next.color;
      autoPersistIfEnabled();
      showToast(`🐾 ${t().presenceLabels[next.label] || next.label}`);
    }

    function scrollToBottom() {
      setTimeout(() => {
        const el = document.getElementById('messages-scroll');
        if (el) el.scrollTop = el.scrollHeight;
      }, 40);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function render() {
      const L = t();

      const completedCount = state.quests.filter(q => q.currentProgress >= q.targetCount).length;
      const srv = getCurrentServer();
      const ch = getCurrentChannel();

      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="app-shell">
          <!-- 1. SERVER RAIL -->
          <div class="server-rail">
            <div class="rail-btn-wrap ${state.navMode === 'dms' ? 'active' : ''}" onclick="openDmsHome()" title="${L.catFriends}">
              <div class="rail-pill"></div>
              <div class="rail-btn">🐾</div>
            </div>

            <div class="rail-btn-wrap ${state.navMode === 'quests' ? 'active' : ''}" onclick="openQuests()" title="${L.questsHeaderTitle}">
              <div class="rail-pill" style="background: var(--gold)"></div>
              <div class="rail-btn">
                🪙
                ${claimableCount > 0 ? `<span class="rail-badge">${claimableCount}</span>` : ''}
              </div>
            </div>

            <div class="rail-divider"></div>

            ${state.servers.map(s => `
              <div class="rail-btn-wrap ${state.navMode === 'server' && state.selectedServerId === s.id ? 'active' : ''}" onclick="selectServer('${s.id}')" title="${escapeHtml(s.name)}">
                <div class="rail-pill"></div>
                <div class="rail-btn">${s.iconEmoji}</div>
              </div>
            `).join('')}

            <div style="flex:1"></div>

            <div class="rail-btn-wrap" onclick="state.modal='createServer';render()" title="${L.createServerTitle}">
              <div class="rail-btn" style="color: var(--mint); font-weight:900">+</div>
            </div>

            <div class="rail-btn-wrap" onclick="saveUserDataNow(true)" title="${L.saveNowBtn} (${state.lastSavedAt})">
              <div class="rail-btn" style="font-size:19px">💾</div>
            </div>

            <div class="rail-btn-wrap" onclick="state.modal='editProfile';render()" title="${L.settingsTitle}">
              <div class="rail-btn" style="font-size:19px">⚙️</div>
            </div>
          </div>

          <!-- 2. CHANNEL / DM SIDEBAR -->
          <div class="channel-sidebar ${state.mobileSidebarOpen ? 'mobile-open' : ''}">
            <div class="sidebar-header">
              ${state.navMode === 'server'
                ? `<span>${srv.iconEmoji} ${escapeHtml(srv.name)}</span>
                   <button class="icon-btn" title="${L.createChannelTitle}" onclick="state.modal='createChannel';render()">＋</button>`
                : `<span>${L.dmsAndHub}</span>`}
            </div>

            <div class="quest-mini-banner" onclick="openQuests()">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <span style="color:var(--gold);font-weight:800;font-size:13px">🪙 ${state.currentUser.meowCoins} ${L.meowCoins}</span>
                <span style="color:var(--text-secondary);font-size:11px">${completedCount}/${state.quests.length} ${L.questsWord}</span>
              </div>
              <div style="font-size:11px;margin-top:4px;color:${claimableCount > 0 ? 'var(--mint)' : 'var(--text-muted)'};font-weight:${claimableCount > 0 ? '700' : '400'}">
                ${claimableCount > 0 ? L.questReady(claimableCount) : L.questSub}
              </div>
            </div>

            <div class="sidebar-scroll">
              ${state.navMode === 'server' ? renderServerChannels(srv) : renderDmSidebar()}
            </div>

            <div class="user-pod">
              <div class="avatar-wrap" onclick="cyclePresence()" title="${state.currentUser.presence}">
                ${state.currentUser.avatarEmoji}
                <div class="status-dot" style="background:${state.currentUser.presenceColor}"></div>
              </div>
              <div style="flex:1;min-width:0;cursor:pointer" onclick="state.modal='editProfile';render()">
                <div style="display:flex;align-items:center;gap:5px">
                  <span style="font-weight:800;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gold)">${escapeHtml(state.currentUser.displayName)}</span>
                  <span class="owner-tag">${L.ownerTag}</span>
                </div>
                <div style="font-size:11px;color:${state.currentUser.presenceColor};font-weight:700;margin-top:2px">
                  ${L.presenceLabels[state.currentUser.presence] || state.currentUser.presence}
                </div>
              </div>
              <button class="icon-btn" title="${L.settingsTitle}" onclick="state.modal='editProfile';render()">⚙️</button>
            </div>
          </div>

          <!-- 3. MAIN CENTER CONTENT -->
          <div class="main-view">
            ${state.navMode === 'quests'
              ? renderQuestsAndShopView()

                  ? renderFriendsDashboard()
                  : renderChatView(ch))}
          </div>

          <!-- 4. MEMBER / DOSSIER SIDEBAR -->
          ${state.navMode !== 'quests' ? renderRightSidebar() : ''}
        </div>

        ${state.toast ? `<div class="toast-box">${escapeHtml(state.toast)}</div>` : ''}

    function renderServerChannels(srv) {
      return srv.categories.map(cat => `
        <div class="cat-header">
          <span>${escapeHtml(cat.name)}</span>
        </div>
        ${cat.channels.map(c => `
          <div class="chan-item ${state.selectedChannelId === c.id ? 'active' : ''}" onclick="selectChannel('${c.id}')">
            <span>${c.prefix}</span>
            <span>${escapeHtml(c.name)}</span>
          </div>
        `).join('')}
      `).join('');
    }

        <div class="chan-item ${state.navMode === 'dms' && state.dmSubView === 'friends' ? 'active' : ''}" onclick="openDmsHome()">

          <span>${L.catFriends} (${friends.length})</span>
        </div>
        <div class="chan-item ${state.navMode === 'quests' ? 'active' : ''}" onclick="openQuests()">
          <span>🪙</span>
          <span>${L.questsAndEmporium}</span>

        <div class="cat-header" style="margin-top:12px">

            </div>
            <div style="min-width:0;flex:1">
              <div style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(u.displayName)}</div>
              <div style="font-size:10.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(u.customStatus)}</div>
            </div>
          </div>
        `).join('')}
      `;

    function renderChatView(ch) {
      const L = t();
      const isDm = state.navMode === 'dms' && state.dmSubView === 'conversation';
      const partner = isDm ? state.users[state.selectedDmUserId] : null;
      const key = getActiveChannelKey();
      const rawMessages = state.messagesByChannel[key] || [];
      const q = state.searchQuery.trim().toLowerCase();
      const messages = q
        ? rawMessages.filter(m => m.content.toLowerCase().includes(q) || m.senderName.toLowerCase().includes(q))
        : rawMessages;

      return `
        <div class="top-bar">
          <button class="icon-btn" onclick="state.mobileSidebarOpen=!state.mobileSidebarOpen;render()" title="Menu">☰</button>

            ? `<span style="font-size:20px">${partner.avatarEmoji}</span>
               <span style="font-weight:800;font-size:15.5px">${escapeHtml(partner.displayName)}</span>
               <span class="badge-tag" style="color:${partner.presenceColor}">${L.presenceLabels[partner.presence] || partner.presence}</span>
               <div style="flex:1"></div>`
            : `<span style="font-size:18px">${ch.prefix}</span>
               <span style="font-weight:800;font-size:15.5px">${escapeHtml(ch.name)}</span>
               <div class="topic-text">${escapeHtml(ch.topic)}</div>`}

          <div class="save-pill" onclick="saveUserDataNow(true)" title="${L.lastSavedText(state.lastSavedAt)}">
            ${L.savePillText}
          </div>
          <div class="lang-pill" onclick="toggleLanguageQuick()" title="Switch Language / تغيير اللغة">
            🌐 ${state.lang === 'ar' ? 'English' : 'العربية'}
          </div>
          <div class="coin-pill" onclick="openQuests()">
            🪙 ${state.currentUser.meowCoins}
          </div>
          <button class="icon-btn" title="${L.pinnedModalTitle}" onclick="state.modal='pinned';render()">📌</button>
          <button class="icon-btn" title="Search" onclick="state.showSearchBar=!state.showSearchBar;render()">🔍</button>
        </div>

    function renderMessageItem(m) {
      const L = t();
      const sticker = m.stickerId ? STICKERS.find(s => s.id === m.stickerId) : null;
      const reactionEntries = Object.entries(m.reactions || {});
      const isOwnerMsg = m.senderIsOwner || m.senderId === state.currentUser.id;

      return `
        <div class="msg-item ${m.isPinned ? 'pinned' : ''}">
          ${m.replyToSenderName ? `
            <div class="reply-line">
              <span>╭── ↩️</span>
              <strong style="color:var(--paw-pink)">@${escapeHtml(m.replyToSenderName)}:</strong>
              <span>${escapeHtml(m.replyToPreview || '')}</span>
            </div>
          ` : ''}
          <div class="msg-row">
            <div class="avatar-wrap" style="width:40px;height:40px;font-size:21px;cursor:default">${m.senderAvatar}</div>
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                <span style="font-weight:800;font-size:14.5px;color:${m.senderRoleColor || '#F4F1FA'}">${escapeHtml(m.senderName)}</span>
                ${isOwnerMsg ? `<span class="owner-tag">${L.ownerTag}</span>` : ''}
                ${m.senderBadge ? `<span class="badge-tag">${escapeHtml(m.senderBadge)}</span>` : ''}
                <span style="font-size:11px;color:var(--text-muted)">${escapeHtml(m.time)}</span>
                ${m.isPinned ? `<span style="font-size:11px;color:var(--gold);font-weight:800">${L.pinnedLabel}</span>` : ''}
              </div>

              ${m.content ? `<div style="margin-top:5px;font-size:14px;line-height:1.42">${escapeHtml(m.content)}</div>` : ''}

              ${sticker ? `
                <div class="sticker-card" style="border-color:${sticker.bgHex}">
                  <div style="font-size:38px">${sticker.artEmoji}</div>
                  <div style="font-size:11.5px;font-weight:900;color:${sticker.bgHex};margin-top:6px">${escapeHtml(sticker.caption)}</div>
                </div>
              ` : ''}

              <div class="reactions-row">
                ${reactionEntries.map(([emoji, users]) => {
                  const active = users.includes(state.currentUser.id);
                  return `
                    <span class="react-pill ${active ? 'active' : ''}" onclick="toggleReaction('${m.id}', '${emoji}')">
                      <span>${emoji}</span>
                      <span>${users.length}</span>
                    </span>
                  `;
                }).join('')}

                ${REACTION_PALETTE.slice(0, 4).map(e => `
                  <span class="msg-action-link" title="React ${e}" onclick="toggleReaction('${m.id}', '${e}')">+${e}</span>
                `).join('')}

                <span class="msg-action-link" onclick='state.replyingTo=${JSON.stringify({ id: m.id, senderName: m.senderName, content: m.content })};render()'>${L.replyBtn}</span>
                <span class="msg-action-link" onclick="togglePin('${m.id}')">${m.isPinned ? L.unpinBtn : L.pinBtn}</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function addFriendFromInput() {
      const el = document.getElementById('new-friend-input');

      const name = el.value.trim();
      const id = 'user_custom_' + Date.now();
      state.users[id] = {
        id,
        username: name.toLowerCase().replace(/\s+/g, '_'),
        displayName: name,
        avatarEmoji: '😺',
        avatarColorHex: '#43D9AD',
        presence: 'Purring',

                </button>
              </div>

              <div style="background:rgba(255,209,102,0.12);border:1px solid rgba(255,209,102,0.4);padding:8px 12px;border-radius:10px;font-size:12px;color:var(--gold);font-weight:700;margin-bottom:14px">
                ${L.ownerBadgeNotice}
              </div>

              <div style="font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:4px">${L.displayNameLabel}</div>
              <input id="prof-name" class="composer-input" style="width:100%;margin-bottom:10px" value="${escapeHtml(state.currentUser.displayName)}" />

              <div style="font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:4px">${L.avatarEmojiLabel}</div>
              <input id="prof-emoji" class="composer-input" style="width:100%;margin-bottom:10px" value="${escapeHtml(state.currentUser.avatarEmoji)}" />

              <div style="font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:4px">${L.customStatusLabel}</div>
              <input id="prof-status" class="composer-input" style="width:100%;margin-bottom:16px" value="${escapeHtml(state.currentUser.customStatus)}" />

              <div style="display:flex;justify-content:flex-end;gap:8px">
                <button class="icon-btn" onclick="state.modal=null;render()">${L.cancelBtn}</button>
                <button class="btn-primary" onclick="saveProfile()">${L.saveBtn}</button>
              </div>
            </div>
          </div>
        `;
      }
      if (state.modal === 'pinned') {
        const key = getActiveChannelKey();
        const pinned = (state.messagesByChannel[key] || []).filter(m => m.isPinned);
        return `
          <div class="modal-backdrop" onclick="if(event.target===this){state.modal=null;render()}">
            <div class="modal-card">
              <div style="font-weight:800;font-size:18px;margin-bottom:14px">${L.pinnedModalTitle}</div>
              ${pinned.length === 0
                ? `<div style="color:var(--text-secondary);font-size:13.5px;margin-bottom:16px">${L.noPinnedMessages}</div>`
                : pinned.map(p => `
                    <div style="background:var(--card-bg);padding:12px;border-radius:12px;margin-bottom:10px">
                      <div style="font-weight:800;color:var(--paw-pink);font-size:13px">${p.senderAvatar} ${escapeHtml(p.senderName)}</div>
                      <div style="font-size:13px;margin-top:4px">${escapeHtml(p.content)}</div>
                    </div>
                  `).join('')}
              <div style="display:flex;justify-content:flex-end">
                <button class="btn-primary" onclick="state.modal=null;render()">${L.closeBtn}</button>
              </div>
            </div>
          </div>
        `;
      }
      return '';
    }

    function createNewServer() {
      const name = document.getElementById('srv-name').value.trim();
      const emoji = document.getElementById('srv-emoji').value.trim() || '🐟';
      if (!name) return;
      const id = 'srv_' + Date.now();
      const chanId = 'chan_' + Date.now();
      state.servers.push({
        id,
        name,
        iconEmoji: emoji,
        categories: [
          {
            id: 'cat_' + Date.now(),
            name: '💬 MEOW CHATS',
            channels: [
              { id: chanId, name: 'general-meows', prefix: '🐾', topic: `Welcome to ${name}!` }
            ]
          }
        ]
      });
      state.messagesByChannel[chanId] = [
        {
          id: 'm_' + Date.now(),
          senderId: state.currentUser.id,
          senderName: state.currentUser.displayName,
          senderAvatar: state.currentUser.avatarEmoji,
          senderRoleColor: state.currentUser.roleColor,
          senderIsOwner: true,
          senderBadge: state.currentUser.equippedBadge,
          content: `Welcome everykitty to ${name} ${emoji}! Grab a cardboard box and make yourselves at home! 🐾✨`,
          reactions: { '🐾': [state.currentUser.id] },
          time: 'Just now',
          isPinned: true
        }
      ];
      state.modal = null;
      autoPersistIfEnabled();
      selectServer(id);
      showToast(`🏰 "${name}"!`);
    }

    function createNewChannel() {
      const name = document.getElementById('chan-name').value.trim().toLowerCase().replace(/\s+/g, '-');
      const topic = document.getElementById('chan-topic').value.trim() || 'Cozy cat discussions';
      if (!name) return;
      const srv = getCurrentServer();
      const chanId = 'chan_' + Date.now();
      srv.categories[0].channels.push({
        id: chanId,
        name,
        prefix: '🐾',
        topic
      });
      state.modal = null;
      autoPersistIfEnabled();
      selectChannel(chanId);
      showToast(`🐾 #${name}!`);
    }

    function saveProfile() {
      const name = document.getElementById('prof-name').value.trim();
      const emoji = document.getElementById('prof-emoji').value.trim();
      const status = document.getElementById('prof-status').value.trim();
      if (name) state.currentUser.displayName = name;
      if (emoji) state.currentUser.avatarEmoji = emoji;
      if (status) state.currentUser.customStatus = status;
      state.modal = null;
      saveUserDataNow(false);
      showToast(state.lang === 'ar' ? '💾 تم حفظ الملف الشخصي والبيانات!' : '💾 Cat Profile & User Data saved!');
    }

    render();
  </script>
</body>
</html>
